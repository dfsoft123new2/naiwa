	<style>
/* ==========================================================================

/* ==========================================================================
   Design tokens that don't depend on the active theme.
   Theme colours live on <body> (general-style.css) because themes.js writes
   them there.
   ========================================================================== */
:root {
	--font-serif: "Crimson Pro", "Noto Serif SC", "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", "STSong", "SimSun", Georgia, "Times New Roman", serif;

	--ink: #101830;                /* text on bright, layer-coloured surfaces */
	--jade: #74d0a2;               /* bought / done */
	--amber: #f2bd55;              /* challenge can be completed */
	--rose: #ff8f9c;               /* destructive */

	--gloss: linear-gradient(180deg, rgba(255, 255, 255, 0.32), rgba(255, 255, 255, 0) 55%),
	         linear-gradient(0deg, rgba(0, 0, 0, 0.14), rgba(0, 0, 0, 0) 42%);
	--lift: inset 0 1px 0 rgba(255, 255, 255, 0.4), inset 0 -2px 0 rgba(0, 0, 0, 0.12), 0 16px 30px -18px rgba(0, 0, 0, 0.95);
	--lift-dim: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 14px 28px -20px rgba(0, 0, 0, 0.95);
	--ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}

* {
	transition-duration: 0.5s;
	transition-timing-function: var(--ease);
	text-align: center;
	font-family: var(--font-serif);
	font-weight: 500;
	table-align: center;
	margin: auto;
	-webkit-text-size-adjust: none;
	text-size-adjust: none;

}

*:focus {
	outline: none;
	webkit-outline: none;
}

/* Keyboard users still get a visible focus ring (mouse clicks don't trigger it) */
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, .link:focus-visible {
	outline: 2px solid var(--points);
	outline-offset: 3px;
}

::selection {
	background: var(--glow-soft, rgba(255, 217, 138, 0.3));
	color: var(--points);
}

html, body {
	min-height: 100%;
	height: 100%;
}

td {
	padding: 0
}

.upgTable {
	display: flex !important;
	flex-flow: column wrap;
	justify-content: center;
	align-items: center;
	max-width: 100%;
	margin: 0 auto;
}

.upgRow {
	display: flex !important;
	flex-flow: row wrap;
	justify-content: center;
	align-items: center;
	max-width: 100%;
	margin: 0 auto;
}

.upgAlign {
	vertical-align: 0
}

.bigUpgAlign {
	vertical-align: 0
}

.treeThing {
	margin: 0 10px 0 10px;
	vertical-align: middle;
}

.can.upg:hover {
	z-index: 2
}

.can.buyable:hover {
	z-index: 2
}

/* Round glass back buttons */
.back, .other-back {
	position: absolute;
	top: 10px;
	width: 40px;
	height: 40px;
	padding: 0;
	border-radius: 50%;
	border: 1px solid var(--hairline);
	background-color: var(--glass);
	-webkit-backdrop-filter: blur(8px);
	backdrop-filter: blur(8px);
	box-shadow: var(--lift-dim);
	color: var(--color);
	font-size: 22px;
	line-height: 1;
	cursor: pointer;
	transition-duration: 0.25s;
}

.back {
	left: 12px;
	top: 12px;
}

.other-back {
	left: 70px;
	top: 12px;
}

.back:hover, .other-back:hover {
	transform: translateX(-2px);
	border-color: var(--glow);
	color: var(--points);
	box-shadow: var(--lift-dim), 0 0 22px -6px var(--glow);
}

.hidden {
	visibility: hidden;
	height: 50px !important;
}

.canvas {
	top: 0;
	left: 0;
	position: absolute;
	z-index: -999;
}

.left {
	position: absolute;
	left: 0;
}

.remove {
	height: 24px;
	width: 24px;
	cursor: pointer;
}

.remove:hover {
	transform: scale(1.1, 1.1);
}

.col {
	min-width: 49.5%;
	max-width: 49.5%;
	width: 49.5%;
	height: 100%;
	min-height: 100%;
	column-span: 1;
	position: absolute;
	overflow-y: auto;
	overflow-x: auto;
	transition-duration: 0s
}

.instant {
	transition-duration: 0s !important
}

.fast {
	transition:color none
}

.col.right {
	top: 0;
	right: 0;
}

#app {
	column-count: 2;
	column-width: 50%;
	min-height: 100%;
}

.vl2 {
	border-left: 1px solid var(--hairline-strong);
	height: 100%;
}

ul {
	list-style-type: none;
}

.fullWidth {
	position: absolute;
	height: 100%;
	width: 100%;
	min-width: 100%;
	overflow-y: auto;
	overflow-x: auto;
	transition-duration: 0s
}

/* Quiet scrollbars that sit inside the night sky */
.col, .fullWidth, .treeOverlay {
	scrollbar-width: thin;
	scrollbar-color: var(--hairline-strong) transparent;
}

::-webkit-scrollbar {
	width: 10px;
	height: 10px;
}

::-webkit-scrollbar-track {
	background: transparent;
}

::-webkit-scrollbar-thumb {
	background-color: var(--hairline-strong);
	border: 3px solid transparent;
	border-radius: 10px;
	background-clip: padding-box;
}

::-webkit-scrollbar-corner {
	background: transparent;
}

.tooltipBox { 
	position: relative;
  }
  
  .tooltipBox:hover .tooltip{
	opacity: 1;
	transform: translateX(-50%) translateY(0);
  }

  .forceTooltip .tooltip{
	opacity: 1;
	transform: translateX(-50%) translateY(0);
  }
  
.respecCheckbox {
	display: inline-block;
}


#loadingSection {
	display: flex;
	flex-direction: column;
	justify-content: center;
}

.treeOverlay {
	pointer-events:none;
	overflow:hidden;
}

.front {
	z-index: 30000
}

.overlayThing {
	z-index: 10000;
	pointer-events:auto;
}

.sideLayers {
	z-index: 10000;
	pointer-events:auto;
	position: absolute;
	right: 55px;
	top: 65px;
	background-color: transparent;
}

button > * {
	pointer-events:none;
}

.ghost {
	visibility: hidden
}

#treeTab td button {
    margin: 0 10px;
}

.bg {
	z-index: -9000;
	width: 100%;
	height: 100%;
	position: absolute;
	background-color: transparent;
	top: 0
}

.bg2 {
	z-index: -9009;
	width: 100%;
	height: 100%;
	position: absolute;
	top: 0
}

.noBackground {
	background: transparent !important;
	background-image: none !important;
	--background: transparent !important;
}

/* Horizontal rules (h-line component) become a soft seam of light */
hr {
	border: 0;
	height: 2px;
	margin: 10px auto;
	background: linear-gradient(90deg, transparent, var(--hairline-strong) 18%, var(--hairline-strong) 82%, transparent);
}

/* Text inputs, sliders and drop-downs used by mods */
input, select, textarea {
	font-family: var(--font-serif);
	font-size: 16px;
	color: var(--color);
	background-color: var(--glass);
	border: 1px solid var(--hairline);
	border-radius: 10px;
	padding: 6px 10px;
	transition-duration: 0.2s;
}

input:focus, select:focus, textarea:focus {
	border-color: var(--glow);
	box-shadow: 0 0 0 3px var(--glow-soft);
}

select option {
	background-color: var(--night);
	color: var(--color);
}

input[type="checkbox"], input[type="radio"], input[type="range"] {
	accent-color: var(--points);
	background: none;
	border: 0;
	padding: 0;
	box-shadow: none;
}

input[type="checkbox"] {
	width: 16px;
	height: 16px;
	cursor: pointer;
}

/* Motion is decorative only; switch it off for people who ask */
@media (prefers-reduced-motion: reduce) {
	*, *::before, *::after {
		animation: none !important;
		transition-duration: 0s !important;
	}
}

</style>
	<style>

.barBorder {

.fill {

	<style>
/* ==========================================================================
   Components. Fills still come from each layer (inline styles); these rules
   add the glass, light and hierarchy. --layer-color is set inline on most
   components so unavailable items can still carry a hint of their layer.
   ========================================================================== */

/* ---- Layer resource: "You have / 1,234 / lollipops, which…" ---- */
.mainDisplay {
	margin: 8px auto 20px;
	max-width: 92%;
}

.mainDisplay .mdLabel {
	display: block;
	font-size: 17px;
	font-style: italic;
	color: var(--muted);
}

.mainDisplay h2 {
	display: block;
	font-size: 56px;
	font-weight: 500;
	line-height: 1.05;
	letter-spacing: -0.01em;
	margin: 2px auto 4px;
}

.mainDisplay .mdResource {
	display: block;
	font-size: 19px;
	font-style: italic;
	line-height: 1.35;
}

/* ---- Upgrades ---- */
.upg {
	min-height: 120px;
	width: 120px;
	margin: 4px;
	padding: 10px 8px;
	border-radius: 18px;
	border: 1px solid rgba(255, 255, 255, 0.22);
	font-size: 12.5px;
	line-height: 1.22;
	overflow: visible;
	color: var(--ink);
	background-image: var(--gloss);
	box-shadow: var(--lift);
	transition-duration: 0.25s;
}

.upg.treeThing {
	margin: 0 10px;
}

.upgContent {
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 5px;
}

.upgContent > span {
	display: block;
	margin: 0;
}

.upgTitle h3 {
	font-size: 15px;
	line-height: 1.08;
	font-weight: 700;
}

.upgEffect {
	font-style: italic;
}

.upgCost {
	width: 100%;
	margin-top: 3px !important;
	padding-top: 6px;
	border-top: 1px solid color-mix(in oklab, currentColor 24%, transparent);
	font-size: 12px;
}

/* A small tick tells bought upgrades apart at a glance */
.upg.bought::after {
	content: "";
	position: absolute;
	top: 8px;
	right: 9px;
	width: 13px;
	height: 13px;
	opacity: 0.55;
	background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M3.5 8.5l3 3 6-7' fill='none' stroke='%23101830' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/></svg>") center / contain no-repeat;
}

/* ---- Achievements ---- */
.achievement {
	height: 90px;
	width: 90px;
	margin: 3px;
	border-radius: 20px;
	border: 1px solid rgba(255, 255, 255, 0.22);
	font-size: 12px;
	line-height: 1.15;
	color: white;
	text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
	background-image: var(--gloss);
	box-shadow: var(--lift);
	transition-duration: 0.25s;
}
.achievement:hover {
	box-shadow: var(--lift), 0 0 0 1px var(--glow), 0 0 22px -2px var(--glow);
	transform: translateY(-2px);
	z-index: 7;
}

.achievement {
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 6px;
	box-sizing: border-box;
}

.achievement br {
	display: none;
}

/* Achievement names stay white over any colour or image a mod gives them */
.achievement.bought, .achievement.locked {
	color: white;
}

/* ---- Buyables ---- */
.buyable {
	height: 200px;
	width: 200px;
	padding: 14px;
	border-radius: 26px;
	border: 1px solid rgba(255, 255, 255, 0.22);
	font-size: 13px;
	line-height: 1.3;
	position:relative;
	color: var(--ink);
	background-image: var(--gloss);
	box-shadow: var(--lift);
	transition-duration: 0.25s;
}

.buyable h2, .upg h2 {
	display: inline-block;
	font-size: 22px;
	margin-bottom: 4px;
}

/* ---- Milestones: a checklist ---- */
table:has(td.milestone), table:has(td.milestoneDone) {
	width: min(560px, 94%);
	border-spacing: 0 8px;
}

.milestone, .milestoneDone {
	width: 100%;
	min-width: 120px;
	height: 64px;
	padding: 12px 20px 12px 60px;
	border-radius: 16px;
	font-size: 15px;
	line-height: 1.3;
	text-align: left;
	box-shadow: var(--lift-dim);
}

.milestone {
	background-color: var(--glass);
	border: 1px solid var(--hairline);
	color: var(--muted);
}

.milestoneDone {
	background-color: color-mix(in oklab, var(--jade) 10%, transparent);
	border: 1px solid color-mix(in oklab, var(--jade) 40%, transparent);
	color: var(--color);
}

.milestone *, .milestoneDone * {
	text-align: left;
}

.milestone > br, .milestoneDone > br {
	display: none;
}

.msReq {
	display: block;
	margin: 0;
	font-size: 18px;
	font-weight: 700;
	line-height: 1.15;
}

.msEffect {
	display: block;
	margin: 2px 0 0;
}

.msToggle {
	display: inline-block;
	margin: 8px 6px 0 0;
}

.msToggle button {
	text-align: center;
}

/* Status mark: an empty dashed ring, or a filled jade check */
.milestone::before, .milestoneDone::before {
	content: "";
	position: absolute;
	left: 20px;
	top: 50%;
	width: 24px;
	height: 24px;
	margin-top: -12px;
	box-sizing: border-box;
	border-radius: 50%;
	text-align: center;
}

.milestone::before {
	border: 1.5px dashed var(--hairline-strong);
}

.milestoneDone::before {
	background: var(--jade) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M3.5 8.5l3 3 6-7' fill='none' stroke='%23101830' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/></svg>") center / 15px 15px no-repeat;
	box-shadow: 0 0 14px -2px var(--jade);
}

/* ---- Challenges: title, terms, then the action ---- */
.challenge {
	position: relative;
	box-sizing: border-box;
	width: 300px;
	min-height: 300px;
	height: auto;
	margin: 8px;
	padding: 26px 24px 22px;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: space-between;
	gap: 14px;
	border-radius: 28px;
	border: 1px solid color-mix(in oklab, var(--layer-color, var(--color)) 32%, transparent);
	background-color: var(--glass);
	background-image: radial-gradient(120% 60% at 50% 0%, color-mix(in oklab, var(--layer-color, var(--color)) 16%, transparent), transparent 70%);
	color: var(--color);
	font-size: 15px;
	line-height: 1.35;
	box-shadow: var(--lift-dim);
}

.challenge > * {
	margin: 0;
}

.challenge.locked {
	background-color: var(--glass);
	color: var(--color);
	cursor: default;
}

.chTitle {
	display: block;
	font-size: 28px;
	font-weight: 600;
	line-height: 1.05;
}

.chBody {
	display: flex;
	flex-direction: column;
	gap: 10px;
}

.chBody > span {
	display: block;
	margin: 0;
}

.chDesc {
	font-style: italic;
	color: var(--muted);
}

.chKey {
	display: block;
	font-size: 13px;
	font-style: italic;
	letter-spacing: 0.04em;
	color: var(--gilt);
}

.challenge.done {
	border-color: color-mix(in oklab, var(--jade) 50%, transparent);
	background-image: radial-gradient(120% 60% at 50% 0%, color-mix(in oklab, var(--jade) 20%, transparent), transparent 70%);
}

.challenge.canComplete {
	border-color: var(--amber);
	background-image: radial-gradient(120% 70% at 50% 0%, color-mix(in oklab, var(--amber) 26%, transparent), transparent 75%);
	box-shadow: var(--lift-dim), 0 0 44px -10px var(--amber);
}

/* ---- Infoboxes ---- */
.story {
    width: 600px;
    max-width: 95%;
    border-bottom: solid 2px;
    border-radius: 14px;
    margin-bottom: 14px;
    text-align: left;
}

.story-title {
    text-align: left;
    font-size: 22px;
    font-weight: 600;
    font-style: italic;
    color: var(--ink);
    cursor: pointer;
    border: none;
    padding: 6px 14px;
    border-radius: 12px 12px 0 0;
    background-image: var(--gloss);
}

.story-title span {
    font-family: inherit;
    font-weight: inherit;
}

.story-toggle {
    border: none;
    background: rgba(9, 15, 33, 0.78);
    color: var(--points);
    font-size: 16px;
    font-style: normal;
    line-height: 1.35;
    pointer-events: none;
    width: 1.35em;
    margin-right: 10px;
    border-radius: 6px;
    display: inline-block;
    text-align: center;
}

.story-text {
	padding: 12px 16px;
    border: solid 2px;
    border-color: inherit;
    border-radius: inherit;
    border-top-left-radius: 0;
    margin-bottom: -2px;
    font-size: 17px;
    line-height: 1.55;
    background-color: color-mix(in oklab, var(--night) 72%, transparent);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
}

.story-text, .story-text * {
    text-align: left;
}


/* ---- Tiles are gridables ---- */
.tile {
	height: 80px;
	width: 80px;
	border-radius: 16px;
	border: 1px solid rgba(255, 255, 255, 0.18);
	font-size: 12px;
	overflow: visible;
	color: var(--ink);
	background-image: var(--gloss);
	box-shadow: var(--lift);
	transition-duration: 0.25s;
}

.tile.can:hover {
	box-shadow: var(--lift), 0 0 0 1px var(--glow), 0 0 22px -2px var(--glow);
	transform: translateY(-2px) scale(1.08, 1.08);
	z-index: 7;
}

.upgBig {
	height: 200px;
	width: 200px;
	border-radius: 26px;
	border: 1px solid rgba(255, 255, 255, 0.22);
	color: var(--ink);
	background-image: var(--gloss);
	box-shadow: var(--lift);
}

/* Used for respec button and similar: a gilt capsule */
.longUpg {
	height: 46px;
	width: 132px;
	background-color: var(--points);
	background-image: var(--gloss);
	border-radius: 999px;
	border: 1px solid rgba(255, 255, 255, 0.35);
	font-size: 15px;
	font-weight: 600;
	color: var(--ink);
	box-shadow: var(--lift);
	transition-duration: 0.25s;
}

.smallUpg {
	height: 36px;
	min-width: 52px;
	width: auto;
	padding: 0 12px;
	border-radius: 999px;
	border: 1px solid rgba(255, 255, 255, 0.25);
	font-size: 13px;
	font-weight: 700;
	color: var(--ink);
	background-image: var(--gloss);
	box-shadow: var(--lift);
	transition-duration: 0.2s;
}

/* Unavailable things become dark glass, lit faintly by their layer's colour */
.upg.locked, .buyable.locked, .tile.locked, .upgBig.locked {
	background-color: color-mix(in oklab, var(--locked) 88%, transparent);
	background-image: radial-gradient(120% 70% at 50% 0%, color-mix(in oklab, var(--layer-color, var(--color)) 16%, transparent), transparent 72%);
	border-color: color-mix(in oklab, var(--layer-color, var(--color)) 32%, transparent);
	box-shadow: var(--lift-dim);
}

.longUpg.locked, .achievement.locked {
	background-image: none;
	border-color: var(--hairline);
	box-shadow: var(--lift-dim);
}

</style>
	<style>
/* Global things */
body {
	color: var(--color);
	overflow: hidden;
	font-size: 17px;

	border-color: rgba(255, 255, 255, 0.16);
	border-radius: 50%;
	box-shadow: var(--hqProperty2a), 0 18px 32px -14px rgba(0, 0, 0, 0.95);
	background-image:
		radial-gradient(circle at 33% 25%, rgba(255, 255, 255, 0.8) 0, rgba(255, 255, 255, 0.3) 9%, rgba(255, 255, 255, 0) 30%),
		radial-gradient(circle at 50% 112%, rgba(255, 255, 255, 0.3) 0, rgba(255, 255, 255, 0) 44%),
		radial-gradient(circle at 50% 44%, rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.34) 100%);
	font-size: 52px;
	font-weight: 600;
	line-height: 1;
	color: rgba(14, 18, 40, 0.72);
	text-shadow: 0 1px 0 rgba(255, 255, 255, 0.34);
	padding: 0;
	margin: 0 10px 0 10px;
	outline: 1px solid var(--gilt-line);
	outline-offset: 9px;
	transition-duration: 0.3s;
}

/* A soft halo in the layer's own colour. The centre is masked out so it never
   tints the orb, only the sky around it. */
.treeNode::before {
	content: "";
	position: absolute;
	top: -24px;
	right: -24px;
	bottom: -24px;
	left: -24px;
	padding: 12px;
	border-radius: 50%;
	background-color: inherit;
	background-clip: content-box;
	filter: blur(12px);
	opacity: 0.45;
	-webkit-mask: radial-gradient(closest-side, transparent calc(100% - 25px), #000 calc(100% - 15px)) no-repeat;
	mask: radial-gradient(closest-side, transparent calc(100% - 25px), #000 calc(100% - 15px)) no-repeat;
	pointer-events: none;
	z-index: -1;
	transition: opacity 0.3s;
}

.treeNode.hidden::before, .treeNode.ghost::before {
	display: none;
}

.treeNode.can:hover::before {
	opacity: 0.8;
}

/* Locked layers are dormant: dark glass, dim label, faint halo */
.treeNode.locked {
	color: var(--muted);
	text-shadow: none;
	background-image:
		radial-gradient(circle at 33% 25%, rgba(255, 255, 255, 0.22) 0, rgba(255, 255, 255, 0.06) 10%, rgba(255, 255, 255, 0) 30%),
		radial-gradient(circle at 50% 44%, rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.3) 100%);
	border-color: var(--hairline);
	outline-style: dashed;
	outline-color: var(--hairline-strong);
}

.treeNode.locked::before {
	opacity: 0.18;
}

.nodeLabel {
	font: inherit;
	font-family: inherit;
}

.treeButton {
	height: 100px;
	width: 100px;
	border: var(--hqProperty1);
	border-color: rgba(255, 255, 255, 0.16);
	border-radius: 33%;
	box-shadow: var(--hqProperty2a), 0 18px 32px -14px rgba(0, 0, 0, 0.95);
	background-image:
		radial-gradient(110% 80% at 30% 12%, rgba(255, 255, 255, 0.5) 0, rgba(255, 255, 255, 0) 46%),
		linear-gradient(0deg, rgba(0, 0, 0, 0.22), rgba(0, 0, 0, 0) 46%);
	font-size: 48px;
	font-weight: 600;
	line-height: 1;
	color: rgba(14, 18, 40, 0.72);
	text-shadow: 0 1px 0 rgba(255, 255, 255, 0.32);
	padding: 0;
	transition-duration: 0.3s;
}

.treeButton.locked {
	color: var(--muted);
	text-shadow: none;
	border-color: var(--hairline);
}

.smallNode {
	height: 60px;
	width: 60px;
	font-size: 34px;
	outline-offset: 6px;
}

/* A reset is available: a lantern-gold ring */
.resetNotify {
	box-shadow: var(--hqProperty2a), 0 0 0 2px var(--glow), 0 0 22px -2px var(--glow);
}

.treeNode.can:hover {
	transform: scale(1.1, 1.1);
	box-shadow: var(--hqProperty2a), 0 0 0 2px var(--glow), 0 0 34px -2px var(--glow);
}

.treeButton.can:hover {
	transform: scale(1.08, 1.08);
	box-shadow: var(--hqProperty2a), 0 0 0 2px var(--glow), 0 0 30px -4px var(--glow);
}

/* Something inside needs attention (glow colour can be overridden per layer) */
.notify {
	transform: scale(1.05, 1.05);
	border-color: rgba(255, 255, 255, 0.22);
	box-shadow: var(--hqProperty2a), 0 0 0 2px rgba(255, 90, 110, 0.7), 0 0 24px rgba(255, 70, 90, 0.85);
}

.treeNode.notify::before {
	animation: tmt-breathe 2.4s ease-in-out infinite;
}

@keyframes tmt-breathe {
	0%, 100% { opacity: 0.45; }
	50% { opacity: 0.9; }
}



.mark {
	position: relative;
	display: inline-block;
	width: 30px;
	height: 30px;
	z-index: 10000;
	margin-left: 0.9em;
	margin-right: 0.9em;
	margin-bottom: 1.2em;
	border-right: 0.3em solid transparent;
	border-bottom: 0.7em solid transparent;
	border-left: 0.3em solid transparent;
	font-size: 10px;
	overflow:auto;
	pointer-events: none;
}

.star {
	position: relative;
	display: inline-block;
	width: 0;
	height: 0;
	z-index: 10000;
	margin-left: 0.9em;
	margin-right: 0.9em;
	margin-bottom: 1.2em;
	border-right: 0.3em solid transparent;
	border-bottom: 0.7em solid #ffcc00;
	border-left: 0.3em solid transparent;
	font-size: 10px;
	pointer-events: none;
	filter: drop-shadow(0 0 3px rgba(255, 204, 0, 0.85));

}

.star:before, .star:after {
	content: "";
    width: 0;
    height: 0;
    position: absolute;
    top: .6em;
    left: -1em;
	border-right: 1em solid transparent;
    border-bottom: 0.7em solid #ffcc00;
    border-left: 1em solid transparent;
	transform: rotate(-35deg);
}

.star:after {
	transform: rotate(35deg);
}

</style>

/* 奶蛙树 · 表情包贴纸风
   节点是贴纸：白色模切边 + 硬投影 + 微微歪着贴；可点的地方有聊天软件式的小红点。
   夜可可（深）/ 眼白（浅）两套主题由 themes.js 写入 --background / --color / --points / --locked。 */

body {
	--font-fun: "ZCOOL KuaiLe", "Yuanti SC", "YouYuan", "PingFang SC", "Microsoft YaHei", sans-serif;
	--font-body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Source Han Sans SC", sans-serif;
	--font-serif: var(--font-body);
	--ink: #3b2a20;
	--frog: #8fd16a;
	--milkdragon: #ffd43b;
	--dot: #ff4d4f;
	--sticker-edge: #fffdf6;
	--drop: 3px 4px 0 rgba(20, 10, 4, 0.38);
	--drop-sm: 2px 3px 0 rgba(20, 10, 4, 0.32);
	font-family: var(--font-body);
	background-image: radial-gradient(color-mix(in oklab, var(--color) 9%, transparent) 1.2px, transparent 1.6px) !important;
	background-size: 26px 26px !important;
	font-variant-numeric: tabular-nums;
}
body::before, body::after { display: none !important; }
body[data-theme="eyewhite"] { --drop: 3px 4px 0 rgba(59, 42, 32, 0.28); --drop-sm: 2px 3px 0 rgba(59, 42, 32, 0.22); --sticker-edge: #ffffff; }

h1, h2, h3, .headTitle, .infoTitle, .upgTitle, .chTitle, .optGroupTitle, .tabButton, .reset, .longUpg, .secTitle, #points {
	font-family: var(--font-fun) !important;
	font-weight: normal !important;
	letter-spacing: 0.02em;
}
#points { color: var(--points); font-size: 30px; }

/* ---------- 树节点：贴纸 ---------- */
.treeNode {
	width: 92px; height: 92px;
	border: 5px solid var(--sticker-edge) !important;
	outline: none !important;
	background-image: radial-gradient(circle at 30% 24%, rgba(255, 255, 255, 0.55) 0 9%, rgba(255, 255, 255, 0) 24%) !important;
	box-shadow: var(--drop) !important;
	color: var(--ink) !important;
	text-shadow: none !important;
	font-family: var(--font-fun);
	font-size: 42px;
	transform: rotate(var(--tilt, 0deg));
	transition: transform 0.18s var(--ease, ease);
}
.treeNode::before { display: none !important; }
.treeNode.w { --tilt: -5deg; } .treeNode.j { --tilt: 4deg; } .treeNode.s { --tilt: -3deg; }
.treeNode.l { --tilt: 6deg; } .treeNode.m { --tilt: -4deg; } .treeNode.n { --tilt: 3deg; }
.treeNode.d { --tilt: -6deg; } .treeNode.k { --tilt: 5deg; } .treeNode.x { --tilt: -2deg; }
.treeNode.z { --tilt: 0deg; } .treeNode.a { --tilt: -8deg; }
.treeNode.can:hover { transform: rotate(0deg) scale(1.07); }
.treeNode:focus-visible, button:focus-visible { outline: 3px dashed var(--points) !important; outline-offset: 4px; }
.treeNode.locked {
	background-color: var(--locked) !important;
	border-color: color-mix(in oklab, var(--sticker-edge) 35%, transparent) !important;
	border-style: dashed !important;
	color: color-mix(in oklab, var(--color) 45%, transparent) !important;
	box-shadow: none !important;
	background-image: none !important;
}
.smallNode { width: 60px !important; height: 60px !important; font-size: 26px !important; border-width: 4px !important; }
.nodeLabel { position: relative; top: 1px; }
/* 未读小红点：有可买的升级 / 可完成的挑战 */
.treeNode.notify { box-shadow: var(--drop) !important; }
.treeNode.notify::after {
	content: ""; position: absolute; top: -4px; right: -4px;
	width: 20px; height: 20px; border-radius: 50%;
	background: var(--dot); border: 3px solid var(--sticker-edge);
	box-shadow: var(--drop-sm);
}
/* 可以重置：贴纸背后一圈奶龙黄 */
.treeNode.resetNotify { box-shadow: 0 0 0 4px var(--milkdragon), var(--drop) !important; }

/* ---------- 提示框 ---------- */
.tooltip {
	font-family: var(--font-body) !important;
	background: var(--background_tooltip) !important;
	color: var(--color) !important;
	border: 2px solid color-mix(in oklab, var(--color) 30%, transparent) !important;
	border-radius: 12px !important;
	box-shadow: var(--drop-sm) !important;
	font-size: 14px !important;
}

/* ---------- 按钮类组件：圆角卡片 + 硬投影 ---------- */
.upg, .buyable, .tile, .achievement, .longUpg, .reset, .challenge {
	border-radius: 18px !important;
	border: 3px solid rgba(255, 255, 255, 0.55) !important;
	box-shadow: var(--drop) !important;
	color: var(--ink) !important;
	font-family: var(--font-body) !important;
	background-image: none !important;
}
.upg.locked, .buyable.locked, .tile.locked, .achievement.locked, .longUpg.locked, .reset.locked, .challenge.locked {
	background-color: var(--locked) !important;
	color: color-mix(in oklab, var(--color) 70%, transparent) !important;
	border: 3px dashed color-mix(in oklab, var(--color) 25%, transparent) !important;
	box-shadow: none !important;
}
.upg.bought, .achievement.bought { filter: saturate(0.85); }
.upg.bought::after { color: var(--ink) !important; }
.upg h2, .buyable h2, .upg h3 { font-family: var(--font-fun) !important; font-weight: normal !important; }
.can:active, .can.upg:active, .can.buyable:active { transform: translate(2px, 3px); box-shadow: 1px 1px 0 rgba(20, 10, 4, 0.38) !important; }
.reset { min-width: 220px; min-height: 92px; font-size: 16px !important; }
.reset.can::after { display: none !important; }
.tile { font-family: var(--font-body) !important; border-width: 2px !important; border-radius: 14px !important; line-height: 1.3; }
.tile h3 { font-size: 13px !important; font-family: var(--font-fun) !important; }
.tile.locked { background-color: var(--locked) !important; }

.milestone, .milestoneDone { border-radius: 14px !important; border: 2px solid color-mix(in oklab, var(--color) 20%, transparent) !important; font-family: var(--font-body) !important; }
.milestoneDone { background-color: color-mix(in oklab, var(--frog) 70%, var(--background)) !important; color: var(--ink) !important; }
.milestone::before, .milestoneDone::before { display: none !important; }

.tabButton {
	border-radius: 999px !important; border: 3px solid var(--layer-color, var(--color)) !important;
	background: transparent !important; color: var(--color) !important; padding: 4px 16px !important; font-size: 17px !important;
}
.tabButton.active { background: var(--layer-color, var(--points)) !important; color: var(--ink) !important; box-shadow: var(--drop-sm) !important; }
.tabButton.notify::after { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--dot); margin-left: 6px; vertical-align: 3px; }

.barBorder { border-radius: 14px !important; border: 3px solid var(--sticker-edge) !important; }
.barBG, .fill { border-radius: 10px; }
.overlayText { font-family: var(--font-fun); font-size: 15px; }

/* ---------- 顶栏 ---------- */
.headTitle { font-size: 22px; color: var(--frog) !important; }
.headThing { margin-top: 3px; }
.hotTopic { display: inline-block; background: var(--dot); color: #fff; border-radius: 6px; padding: 1px 8px; font-size: 13px; }
.hotTopic::before { content: "热"; display: inline-block; margin-right: 6px; padding: 0 4px; background: #fff; color: var(--dot); border-radius: 4px; font-weight: bold; font-size: 11px; }
.laughLv { color: var(--milkdragon); font-size: 13px; }
.inChal { display: inline-block; border: 2px dashed var(--dot); border-radius: 8px; padding: 1px 8px; font-size: 13px; }
.awareHead { font-family: var(--font-fun); color: var(--frog); }

/* ---------- 侧栏按钮 ---------- */
#optionWheel, #info {
	width: 44px !important; height: 44px !important; border-radius: 50% !important;
	background: var(--sticker-edge) !important; color: var(--ink) !important;
	border: none !important; box-shadow: var(--drop-sm) !important;
	font-size: 22px !important; line-height: 44px !important; text-align: center; cursor: pointer; padding: 0 !important;
	font-family: var(--font-fun) !important;
}
#info { font-size: 20px !important; }
#info br { display: none; }
#version { font-family: var(--font-fun); }

/* ---------- 各层自定义内容 ---------- */
.hint { color: color-mix(in oklab, var(--color) 68%, transparent); font-size: 14px; }
.warn { color: var(--dot); font-weight: bold; }
.pokeFace { font-size: 72px; line-height: 1.05; display: inline-block; }
#clickable-w-11 { color: var(--ink) !important; }
#clickable-w-11 b { font-family: var(--font-fun); font-size: 18px; font-weight: normal; }
@keyframes nwShake { 0%, 100% { transform: rotate(-4deg) } 50% { transform: rotate(4deg) scale(1.03) } }
@media (prefers-reduced-motion: reduce) { #clickable-w-11 { animation: none !important; } .treeNode { transition: none; } }

.egg { display: inline; color: var(--milkdragon); }
.lastBox { display: inline-block; margin: 8px auto; padding: 6px 14px; border-radius: 12px; background: color-mix(in oklab, var(--color) 10%, transparent); max-width: 560px; }
.famTable { margin: 10px auto; border-collapse: separate; border-spacing: 0 4px; font-size: 14px; }
.famTable th { font-weight: normal; color: color-mix(in oklab, var(--color) 60%, transparent); padding: 0 10px; text-align: left; }
.famTable td { padding: 3px 10px; text-align: left; background: color-mix(in oklab, var(--color) 6%, transparent); }
.famTable td:first-child { border-radius: 10px 0 0 10px; } .famTable td:last-child { border-radius: 0 10px 10px 0; }
.famIcon { font-size: 22px; text-align: center !important; }
.famTable small { color: var(--milkdragon); margin-left: 4px; }
.famUnknown { opacity: 0.55; }
.stand { letter-spacing: -3px; }
.schoolSum { max-width: 720px; margin: 10px auto; font-size: 13px; }
.schoolSum span { display: inline-block; margin: 3px 10px; }
.dragonColor { display: inline-block; margin: 10px auto 6px; padding: 8px 20px; border-radius: 16px; border: 4px solid var(--dc); box-shadow: var(--drop-sm); }
.dragonColor b { font-family: var(--font-fun); font-weight: normal; font-size: 20px; color: var(--dc); }
.swatches { margin: 8px 0; }
.swatches span { display: inline-block; width: 34px; height: 34px; line-height: 30px; border-radius: 50%; margin: 3px; color: var(--ink); border: 3px solid var(--sticker-edge); font-family: var(--font-fun); opacity: 0.55; }
.swatches span.on { opacity: 1; transform: scale(1.22) rotate(-6deg); box-shadow: var(--drop-sm); }
.secTitle { margin-top: 10px; }
.stars { color: #e8a300; font-size: 15px; letter-spacing: 1px; }
.buyable i { color: color-mix(in oklab, var(--ink) 75%, transparent); }
.taste { display: inline-block; margin: 8px; padding: 6px 14px; border-radius: 12px; border: 2px dashed color-mix(in oklab, var(--color) 35%, transparent); max-width: 620px; }
.filmLog { margin: 10px auto; max-width: 560px; text-align: left; line-height: 1.8; font-size: 14px; padding: 8px 16px; border-radius: 12px; background: color-mix(in oklab, var(--color) 6%, transparent); }
h3.box, h3.fat { display: inline; color: var(--milkdragon); }
.ctxWin { margin: 8px auto; }
.ctxBar { width: 340px; max-width: 80vw; height: 12px; margin: 6px auto; border-radius: 6px; background: color-mix(in oklab, var(--color) 15%, transparent); overflow: hidden; }
.ctxBar i { display: block; height: 100%; background: #7ec8f0; border-radius: 6px; }
.prompt { font-size: 18px; margin: 10px; }
.slot { display: inline-block; min-width: 38px; padding: 2px 10px; border-radius: 10px; background: #ff8fd8; color: var(--ink); font-family: var(--font-fun); font-weight: normal; }
.slot.empty { background: transparent; border: 2px dashed color-mix(in oklab, var(--color) 45%, transparent); color: color-mix(in oklab, var(--color) 60%, transparent); }
.gallery { display: grid; grid-template-columns: repeat(4, minmax(0, 160px)); gap: 8px; justify-content: center; margin: 12px auto; }
.gallery .var { padding: 8px; border-radius: 14px; border: 2px dashed color-mix(in oklab, var(--color) 25%, transparent); font-size: 12px; line-height: 1.4; }
.gallery .var b { display: block; font-family: var(--font-fun); font-weight: normal; font-size: 16px; }
.gallery .var small { display: block; color: color-mix(in oklab, var(--color) 55%, transparent); }
.gallery .var.on { background: #ff8fd8; color: var(--ink); border: 3px solid var(--sticker-edge); box-shadow: var(--drop-sm); }
.gallery .var.on small { color: color-mix(in oklab, var(--ink) 65%, transparent); }
.awareInfo { margin: 8px auto; line-height: 1.7; }
.stat { max-width: 560px; margin: 0 auto; }
.stat table { width: 100%; border-collapse: collapse; font-size: 14px; }
.stat td { padding: 4px 10px; border-bottom: 1px dashed color-mix(in oklab, var(--color) 18%, transparent); text-align: left; }
.stat td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.stat tr.total td { border-bottom: none; font-family: var(--font-fun); font-size: 17px; color: var(--points); }
.stat p { font-size: 13px; color: color-mix(in oklab, var(--color) 65%, transparent); }

/* ---------- 通关页 ---------- */
.ending { max-width: 560px; margin: 0 auto; padding: 40px 20px; line-height: 1.9; }
.ending .bigFrog { font-size: 96px; display: inline-block; transform: rotate(-6deg); }
.ending h2 { font-size: 34px; color: var(--frog); }
.ending p { margin: 6px 0; }

@media (max-width: 640px) {
	.gallery { grid-template-columns: repeat(2, minmax(0, 160px)); }
	.treeNode { width: 76px; height: 76px; font-size: 34px; }
}

/* ---------- 修正 ---------- */
html { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
#clickable-w-11 { border-radius: 50% !important; }
.gallery .var { width: 100%; box-sizing: border-box; min-height: 66px; }
.headLabel, .headUnit, .headRate { font-style: normal !important; font-family: var(--font-body) !important; }
.laughLv, .famTable small, .egg, h3.box, h3.fat { color: var(--points) !important; }
.dragonColor b { color: var(--ink); background: var(--dc); padding: 0 8px; border-radius: 8px; }
body[data-theme="eyewhite"] .treeNode:not(.locked) { outline: 2px solid rgba(59, 42, 32, 0.28) !important; outline-offset: 0; }
body[data-theme="eyewhite"] .treeNode.notify::after { border-color: #fff; }
body[data-theme="eyewhite"] .upg, body[data-theme="eyewhite"] .buyable, body[data-theme="eyewhite"] .reset { border-color: rgba(59, 42, 32, 0.18) !important; }

.milkPortrait { display:inline-block; width:1.5em; height:1.5em; object-fit:contain; vertical-align:middle; pointer-events:none; }
.treeNode .nodeLabel:has(.milkPortrait) { display:grid; place-items:center; width:100%; height:100%; top:0; }
.treeNode .milkPortrait { width:93%; height:93%; }
.treeNode.locked .milkPortrait { filter:grayscale(.8); opacity:.72; }
.pokeFace { line-height:0; }
.pokeFace .milkPortrait { width:110px; height:110px; }
.bigFrog .milkPortrait { width:116px; height:116px; }
.famIcon .milkPortrait { width:38px; height:38px; }
.dragonColor { display:inline-flex; align-items:center; gap:9px; }
.dragonColor .milkPortrait { width:52px; height:52px; }
.stand { letter-spacing:0; white-space:nowrap; }
.stand .milkPortrait { width:19px; height:19px; }
.r3Status { display:inline-flex; align-items:center; gap:8px; max-width:100%; }
.r3Status .milkPortrait { width:48px; height:48px; flex:none; }

.phoneStatus, .phoneNav, .phoneTreeIntro, .branchName { display: none; }
#treeCanvas { transition: none; pointer-events: none; }
.branchRow { display: flex; justify-content: center; padding-bottom: 50px; }
.branchNode { margin: 0; }

@media (max-width: 1023px) {
	html { padding: 0; }
	#app {
		column-count: auto; column-width: auto; min-height: 0; height: 100%; height: 100dvh;
		display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr);
		--phone-left: max(12px, env(safe-area-inset-left));
		--phone-right: max(12px, env(safe-area-inset-right));
	}
	.phoneStatus, .phoneNav {
		position: relative; z-index: 4; margin: 0; box-sizing: border-box;
		background: var(--background); padding-inline: var(--phone-left) var(--phone-right);
	}
	.phoneStatus {
		grid-row: 1; display: flex; flex-wrap: wrap; gap: 2px 9px; align-items: baseline;
		padding-block: calc(10px + env(safe-area-inset-top)) 9px; border-bottom: 1px solid var(--hairline-strong);
	}
	.phoneStatus > * { margin: 0; }
	.phoneStatus strong { margin-right: auto; font: 21px var(--font-fun); }
	.phoneStatus b { color: var(--gilt); font: 21px var(--font-fun); }
	.phoneStatus small { font-size: 13px; }
	.phoneNav {
		grid-row: 3; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px;
		padding-block: 4px calc(4px + env(safe-area-inset-bottom)); border-top: 1px solid var(--hairline-strong);
	}
	.phoneNav button, .phoneLink {
		margin: 0; min-height: 44px; color: var(--color); font: 16px var(--font-body);
		background: transparent; border: 0; cursor: pointer;
	}
	.phoneNav button { border-radius: 12px; }
	.phoneNav [aria-current="page"] { background: var(--frog); color: var(--ink); font-weight: bold; }
	.phoneLink { color: var(--gilt); text-decoration: underline; text-underline-offset: 3px; }
	button { touch-action: manipulation; }
	#treeOverlay, #treeTab > br, #fakeHead { display: none; }
	#treeTab, #app > .tab {
		grid-area: 2 / 1; position: relative; inset: auto; margin: 0; box-sizing: border-box;
		width: 100%; max-width: none; min-width: 0; min-height: 0; height: auto; overflow: auto;
		padding: 16px var(--phone-right) 24px var(--phone-left); overscroll-behavior-y: contain;
	}
	#treeTab > .bg, .tab > .bg { inset: 0; }
	.phoneTreeIntro { display: block; margin: 0 auto 22px; }
	.phoneTreeIntro h2 { display: inline; vertical-align: middle; }
	.phoneTreeIntro button { vertical-align: middle; margin-left: 12px; }
	.branchRow { gap: 8px; padding-bottom: 24px; }
	.branchRow:empty { display: none; }
	.branchNode { display: flex; flex-direction: column; align-items: center; width: min(27%, 96px); }
	.branchNode .treeNode { margin: 0; max-width: 100%; }
	.branchName { display: block; margin: 7px 0 0; font-size: 14px; background: var(--background); }
	.upgCol { width: 100%; min-width: 0; max-width: 760px; }
	.upgRow > div { max-width: 100%; min-width: 0; }
	.tab .mainDisplay { margin-block: 6px 10px; }
	.tab .mainDisplay h2 { display: inline; font-size: 32px; }
	.tab .mainDisplay .mdResource { display: inline; }
	.tab .reset { max-width: 100%; min-width: 0; min-height: 66px; padding: 8px 16px; }
	.tab .hint { display: block; max-width: 32em; margin: 8px auto; line-height: 1.55; color: var(--color); }
	#clickable-w-11 { touch-action: manipulation; }
	#clickable-w-11 { -webkit-tap-highlight-color: transparent; }
	#clickable-w-11:active { transform: scale(.97); }
	.gameBar > div { position: relative; display: block !important; max-width: 100%; }
	.gameBar .barBorder { box-sizing: border-box; width: 100% !important; }
	.gameBar .barBG { position: relative; }
	.gameBar .fill { left: 0; top: 0; width: 100% !important; height: 100% !important; margin: 0; }
	.gameBar .overlayTextContainer { inset: 0; align-items: center; }
	.gameBar .overlayText { text-shadow: none; }
	.optionsPanel, .infoPanel, .challenge, .gallery, .milestone, .milestoneDone { box-sizing: border-box; max-width: 100%; }
	.infoPanel, .optionsPanel { width: min(100%, 540px); }
	.opt.optAction, .tabButton { min-height: 44px; }
	.famTable th, .famTable td { padding-inline: 3px; }
	.famTable { max-width: 100%; overflow-wrap: anywhere; }
	.popup-container {
		position: fixed; top: auto; right: var(--phone-right); bottom: calc(58px + env(safe-area-inset-bottom));
		width: min(300px, calc(100% - var(--phone-left) - var(--phone-right))); pointer-events: none;
		max-height: 30vh; overflow: auto;
	}
	.popup { width: 100%; box-sizing: border-box; pointer-events: auto; min-height: 44px; margin: 4px 0; padding: 8px 14px; }
	.popup:not(:last-child) { display: none; }
	.popup h2 { font-size: 16px; }
	@media (hover: none) {
		/* Invisible tooltips otherwise widen scroll containers; allow a focused node to explain its lock. */
		.tooltipBox:not(:focus):not(.forceTooltip) > .tooltip { display: none; }
		#clickable-w-11 > .tooltip { display: none; }
		.tooltipBox:focus > .tooltip { max-width: min(180px, 95%); box-sizing: border-box; }
	}
}

@media (max-width: 1023px) and (max-height: 440px) and (orientation: landscape) {
	#clickable-w-11 { width: 130px !important; height: 130px !important; }
	#clickable-w-11 .milkPortrait { width: 78px; height: 78px; }
}

<script>
// 奶蛙树 · 核心
// NW 命名空间：数学工具、数据表，以及所有跨层加成（集中登记在本文件底部，
// 每一项都有名字，“奶学 → 加成明细”页会逐项列出，方便玩家和作者追查数值来源）。

function nd(x) { return new Decimal(x) }

var NW = {
	art: MilkArt,
	smooth: false,
	rnd() { return Math.random() },
	pick(arr) { return arr[Math.floor(NW.rnd() * arr.length)] },
	// log10(x+1)
	lg(x) { return nd(x).max(0).add(1).log10() },
	// (1 + log10(x+1))^p ——“对数幂”，收集类加成一律用它，只涨不爆
	lp(x, p) { return NW.lg(x).add(1).pow(p) },
	u(l, id) {
		if (l === 'w' && id <= 25 && player.l && player.l.activeChallenge == 14) return false // 盗版奶龙
		return hasUpgrade(l, id)
	},
	ms(l, id) { return hasMilestone(l, id) },
	ch(l, id) { return challengeCompletions(l, id) > 0 },
	inC(l, id) { return player[l] && player[l].activeChallenge == id },
	bA(l, id) { return getBuyableAmount(l, id) },
	stars(id) { return player.m ? getBuyableAmount('m', id).toNumber() : 0 },
	totalStars() { let t = 0; for (const w of NW.WORKS) t += NW.stars(w.id); return t },
	card(id) {
		if (!player.d || !player.d.eq.includes(id)) return false
		if (NW.inC('z', 11) && id !== 1) return false // 被世界遗忘：只有豆包还记得
		return true
	},
	vlv(id) { return (player.x && player.x.found[id]) || 0 },
	big(x) { return format(x) },
	// 第 3 行及以上的重置：保留结构性进度（升级、里程碑、挑战、星级）
	high(r) { return layers[r].row >= 3 },
	keepFam(r) { return NW.ms('l', 3) || NW.high(r) && (NW.ms('n', 0) || NW.ms('k', 0)) },
	pct(x) { return (x * 100).toFixed(x < 0.01 ? 4 : 2) + '%' },
}

// ============ 加成登记表 ============
NW.F = {}
NW.def = function (key, label, fn) { (NW.F[key] = NW.F[key] || []).push({ label, fn }) }
NW.val = function (v) { return (v === undefined || v === null || v === false || v === 0) ? null : nd(v) }
NW.mult = function (key) {
	let r = nd(1)
	const list = NW.F[key]
	if (!list) return r
	for (const f of list) { const v = NW.val(f.fn()); if (v) r = r.times(v) }
	return r
}
NW.breakdown = function (key) {
	const out = []
	for (const f of NW.F[key] || []) { const v = NW.val(f.fn()); if (v && !v.eq(1)) out.push([f.label, v]) }
	return out
}
NW.KEYS = {
	ha: '哈', wa: '奶蛙', ji: '奶鸡', egg: '奶蛋产量', ck: '打卡速度', fz: '狂笑倍率', color: '奶龙变色效果',
	long: '奶龙', ins: '灵感', film: '胶片', box: '票房', rice: '米饭上限', fat: '膘', kang: '袋鼠',
	xg: '畸变点', zg: '正名', aw: '认知度传播速度',
}

// ============ 笑点：哈的获取量过高时，超出部分的指数被压缩 ============
NW.laughCap = function (g) {
	if (g.lte(1e100)) return g
	let e = g.log10().toNumber()
	const t = NW.laughThresholds(), p = NW.laughPower()
	let out = e
	if (e > t[0]) out = t[0] + (Math.min(e, t[1]) - t[0]) * p
	if (e > t[1]) out += (Math.min(e, t[2]) - t[1]) * p * p
	if (e > t[2]) out += (e - t[2]) * p * p * p
	return Decimal.pow(10, out)
}
NW.laughThresholds = function () {
	let a = 100
	if (NW.u('w', 35)) a += 20
	if (NW.u('z', 13)) a += 60
	return [a, a * 10, a * 100]
}
NW.laughPower = function () { return Math.min(0.9, 0.5 + 0.05 * NW.vlv(16) + (NW.u('m', 15) ? 0.05 : 0)) }
NW.laughLevel = function () {
	const g = NW.rawHa ? NW.rawHa : nd(1)
	const t = NW.laughThresholds()
	const e = g.max(1).log10().toNumber()
	return e > t[2] ? 3 : e > t[1] ? 2 : e > t[0] ? 1 : 0
}

<script>
// 第 0、1 行：奶蛙 · 奶鸡 · 立牌

// ================= 奶蛙：戳一下就狂笑 =================
NW.mirthCap = function () {
	let c = 20
	if (NW.u('w', 15)) c -= 8
	c -= NW.stars(25)
	return Math.max(3, c)
}
NW.frenzyDur = function () {
	return 10 + NW.lg(player.j.fam.r).toNumber() * 1.5 + NW.stars(15) * 2
}
NW.chokeDur = function () { return NW.u('w', 23) ? 6 : 15 }
NW.frenzyMult = function () {
	let m = nd(NW.u('w', 14) ? 6 : 3).times(NW.mult('fz'))
	if (NW.card(2)) m = m.pow(1.2)
	return m
}
NW.autoPoke = function () {
	let r = 0
	if (NW.ms('j', 0)) r += 1
	if (NW.ms('s', 0)) r += 1
	if (NW.ms('l', 0)) r += 2
	r += NW.stars(35)
	if (NW.u('l', 24)) r *= 5
	if (NW.ch('l', 12)) r *= 2
	return r
}
NW.frenzyFactor = function () {
	if (NW.inC('l', 12)) return 1
	const w = player.w, m = NW.frenzyMult()
	const ap = NW.autoPoke()
	if (NW.smooth && ap > 0) { // 离线或后台的长帧：按平均狂笑时间折算
		const fill = NW.mirthCap() / (ap * (NW.u('w', 24) ? 2 : 1))
		const dur = NW.frenzyDur(), up = dur / (dur + NW.chokeDur() + fill)
		return m.sub(1).times(up).add(1)
	}
	return w.frenzy > 0 ? m : 1
}
NW.poke = function (n, auto) {
	const w = player.w
	if (NW.inC('l', 12) || w.choke > 0) return false
	w.pokes += n
	w.idle = 0
	if (!auto) player.points = player.points.add(tmp.pointGen.times(0.5 * n).max(n))
	if (w.frenzy > 0) return true
	w.mirth += n * (NW.u('w', 24) ? 2 : 1)
	if (w.mirth >= NW.mirthCap()) {
		w.mirth = 0
		w.frenzy = NW.frenzyDur()
		w.frenzies++
	}
	return true
}
NW.wTick = function (diff) {
	const w = player.w
	NW.smooth = diff > 2
	if (w.frenzy > 0) {
		w.frenzy -= diff
		if (w.frenzy <= 0) { w.frenzy = 0; w.choke = NW.chokeDur() }
	} else if (w.choke > 0) {
		w.choke = Math.max(0, w.choke - diff)
	} else {
		const ap = NW.autoPoke()
		if (ap > 0) {
			w.autoAcc += ap * diff
			const k = Math.floor(w.autoAcc)
			if (k > 0) { w.autoAcc -= k; NW.poke(Math.min(k, 1000), true) }
		} else {
			w.idle += diff
			if (w.idle > 2) w.mirth = Math.max(0, w.mirth - diff)
		}
	}
}
NW.wState = function () {
	const w = player.w
	if (NW.inC('l', 12)) return 'smell'
	return w.frenzy > 0 ? 'frenzy' : w.choke > 0 ? 'choke' : 'calm'
}

addLayer('w', {
	name: '奶蛙', symbol: NW.art.img('frenzy'), position: 0, row: 0,
	color: '#8fd16a',
	resource: '奶蛙', baseResource: '哈',
	baseAmount() { return player.points },
	requires: nd(10), type: 'normal', exponent: 0.5,
	softcap: nd(1e20), softcapPower: 0.5,
	startData() { return { unlocked: true, points: nd(0), best: nd(0), total: nd(0), mirth: 0, frenzy: 0, choke: 0, pokes: 0, frenzies: 0, autoAcc: 0, idle: 0 } },
	gainMult() { return NW.mult('wa') },
	gainExp() { return nd(1) },
	passiveGeneration() { return NW.ms('s', 1) ? 0.5 : 0 },
	tooltip() { return formatWhole(player.w.points) + ' 奶蛙' + (player.w.frenzy > 0 ? '<br>正在狂笑！' : '') },
	hotkeys: [
		{ key: 'w', description: 'W：奶蛙重置', onPress() { if (canReset('w')) doReset('w') } },
		{ key: 'p', description: 'P：戳一下奶蛙', onPress() { NW.poke(1) } },
	],
	layerShown() { return true },
	update(diff) { NW.wTick(diff) },
	doReset(r) {
		if (layers[r].row <= this.row) return
		const keep = []
		if (NW.ms('j', 1) || NW.ms('l', 1) || NW.high(r)) keep.push('upgrades')
		const pokes = player.w.pokes, fr = player.w.frenzies
		layerDataReset(this.layer, keep)
		player.w.pokes = pokes; player.w.frenzies = fr
	},
	bars: {
		mirth: {
			direction: RIGHT, width: 380, height: 34,
			progress() {
				const w = player.w
				if (w.frenzy > 0) return w.frenzy / NW.frenzyDur()
				if (w.choke > 0) return w.choke / NW.chokeDur()
				return w.mirth / NW.mirthCap()
			},
			display() {
				const w = player.w, s = NW.wState()
				if (s === 'smell') return '鲱鱼罐头太臭了，奶蛙笑不出来'
				if (s === 'frenzy') return `狂笑中！哈 ×${format(NW.frenzyMult())}　还剩 ${w.frenzy.toFixed(1)} 秒`
				if (s === 'choke') return `笑岔气了……${w.choke.toFixed(1)} 秒后恢复`
				return `笑意 ${Math.floor(w.mirth)} / ${NW.mirthCap()}`
			},
			fillStyle() {
				const s = NW.wState()
				return { 'background-color': s === 'frenzy' ? '#ffd43b' : s === 'choke' ? '#c9b8a6' : '#8fd16a' }
			},
			baseStyle: { 'background-color': 'rgba(0,0,0,0.18)' },
			textStyle: { color: '#3b2a20', 'font-weight': 'bold' },
		},
	},
	clickables: {
		11: {
			display() {
				const s = NW.wState(), w = player.w
				const face = NW.art.img(s)
				const say = s === 'frenzy' ? NW.LAUGHS[w.pokes % NW.LAUGHS.length] : s === 'choke' ? '咳咳……' : s === 'smell' ? '呕——' : '戳我一下'
				return `<span class="pokeFace">${face}</span><br><b>${say}</b>`
			},
			canClick() { return NW.wState() === 'calm' || NW.wState() === 'frenzy' },
			onClick() { NW.poke(1) },
			style() { return { width: '170px', height: '170px', 'border-radius': '50%', 'font-size': '15px', animation: NW.wState() === 'frenzy' ? 'nwShake 0.3s infinite' : '' } },
			tooltip() { return '每戳一下：立刻得到半秒的哈，并积攒笑意。笑意满了，奶蛙会狂笑一阵。' },
		},
	},
	buyables: {
		11: {
			title: '表情包',
			unlocked() { return NW.u('w', 22) || NW.bA('w', 11).gt(0) },
			cost(x) { return nd(100).times(Decimal.pow(3, x.pow(1.15))) },
			effect(x) { return Decimal.pow(1.5, x) },
			display() {
				return `把奶蛙狂笑的瞬间截成表情包。\n效果：哈 ×${format(this.effect())}\n已收藏：${formatWhole(NW.bA('w', 11))} 张\n价格：${format(this.cost())} 奶蛙`
			},
			canAfford() { return player.w.points.gte(this.cost()) },
			buy() {
				const c = this.cost()
				if (player.w.points.lt(c)) return
				player.w.points = player.w.points.sub(c)
				addBuyables('w', 11, 1)
			},
		},
	},
	upgrades: {
		11: { title: '哈？', description: '哈的获取 ×3。', cost: nd(1) },
		12: { title: '哈哈', description: '奶蛙越多，哈越多。', cost: nd(2), effect() { return player.w.points.add(1).pow(0.35) }, effectDisplay() { return '×' + format(this.effect()) } },
		13: { title: '哈哈哈', description: '哈越多，哈得越快。', cost: nd(5), effect() { return player.points.add(10).log10().pow(2) }, effectDisplay() { return '×' + format(this.effect()) } },
		14: { title: '笑出鹅叫', description: '狂笑时，哈的倍率从 ×3 提高到 ×6。', cost: nd(15) },
		15: { title: '憋不住了', description: '笑意上限 -8。', cost: nd(40) },
		21: { title: '魔性洗脑', description: '哈越多，重置得到的奶蛙越多。', cost: nd(100), effect() { return player.points.add(10).log10().pow(0.8) }, effectDisplay() { return '×' + format(this.effect()) } },
		22: { title: '表情包大户', description: '解锁“表情包”。', cost: nd(250) },
		23: { title: '笑岔气是福', description: '笑岔气只持续 6 秒，岔气期间哈 ×1.5。', cost: nd(800) },
		24: { title: '点一下就狂笑', description: '每戳一下积攒 2 点笑意。', cost: nd(3000) },
		25: { title: '笑声传染', description: '累计戳奶蛙的次数提高哈的获取。', cost: nd(1e4), effect() { return nd(player.w.pokes + 1).pow(0.25) }, effectDisplay() { return '×' + format(this.effect()) } },
		31: { title: '蛙鸣鸡叫', description: '奶鸡提高奶蛙的获取。', cost: nd(1e5), unlocked() { return player.j.unlocked }, effect() { return player.j.points.add(1).pow(0.15) }, effectDisplay() { return '×' + format(this.effect()) } },
		32: { title: '流动的笑', description: '每块立牌使哈 ×1.4（最多算 60 块）。', cost: nd(5e5), unlocked() { return player.s.unlocked }, effect() { return Decimal.pow(1.4, player.s.points.min(60)) }, effectDisplay() { return '×' + format(this.effect()) } },
		33: { title: '大笑奶龙', description: '奶龙提高哈的获取。', cost: nd(1e25), unlocked() { return player.l.unlocked }, effect() { return NW.lp(player.l.points, 3) }, effectDisplay() { return '×' + format(this.effect()) } },
		34: { title: '奶蛙表情包上热搜', description: '奶蛙越多，重置得到的奶蛙越多。', cost: nd(1e30), unlocked() { return player.l.unlocked }, effect() { return player.w.points.add(10).log10().pow(2) }, effectDisplay() { return '×' + format(this.effect()) } },
		35: { title: '笑点降低', description: '“笑点”的门槛提高 1e20 倍。', cost: nd(1e45), unlocked() { return player.m.unlocked } },
	},
	tabFormat() {
		const hint = NW.autoPoke() > 0 ? `奶蛙每秒自己笑 ${formatWhole(NW.autoPoke())} 下（自动戳）。` : '连续戳奶蛙，笑意满了它会狂笑；停手两秒以上，笑意会慢慢消退。'
		const poke = [['bar', 'mirth'], 'blank', ['clickable', 11], ['display-text', `<span class="hint">${hint}</span>`]]
		const prestige = ['main-display', 'prestige-button', 'resource-display']
		return (tmp.other.screenWidth < 1024 ? [...poke, 'blank', ...prestige] : [...prestige, 'blank', ...poke]).concat(['blank', 'buyables', 'upgrades'])
	},
})

// ================= 奶鸡：奶蛋就是盲盒 =================
NW.boxSize = function () { return (NW.u('j', 13) ? 2 : 1) * (NW.u('j', 25) ? 5 : 1) * (NW.u('l', 14) ? 2 : 1) }
NW.hiddenMult = function () {
	return (NW.u('j', 14) ? 2 : 1) * (NW.ch('l', 13) ? 2 : 1) * (NW.u('l', 14) ? 1.5 : 1) * (1 + 0.3 * NW.stars(22)) * (NW.card(3) ? 3 : 1)
}
NW.famProbs = function (extra) {
	const h = NW.hiddenMult() * (extra || 1)
	const p = NW.FAM.map(f => f.p * (f.hidden ? h : 1))
	let hid = p[6] + p[7]
	if (hid > 0.5) { const k = 0.5 / hid; p[6] *= k; p[7] *= k; hid = 0.5 }
	for (let i = 0; i < 6; i++) p[i] = NW.FAM[i].p / 0.97 * (1 - hid)
	return p
}
NW.openBoxes = function (n, extra, manual) {
	n = nd(n).floor()
	if (n.lte(0)) return
	const j = player.j
	const T = n.times(NW.boxSize())
	const probs = NW.inC('l', 13) ? [1, 0, 0, 0, 0, 0, 0, 0] : NW.famProbs(extra)
	if (T.lt(40)) {
		const k = T.toNumber(), got = {}
		for (let i = 0; i < k; i++) {
			let r = NW.rnd(), idx = 0
			while (idx < 7 && r >= probs[idx]) { r -= probs[idx]; idx++ }
			const f = NW.FAM[idx]
			j.fam[f.id] = j.fam[f.id].add(1)
			got[idx] = (got[idx] || 0) + 1
		}
		j.last = Object.keys(got).map(i => `${NW.FAM[i].name}×${got[i]}`).join('　')
		if (manual && (got[6] || got[7])) {
			const f = NW.FAM[got[7] ? 7 : 6]
			doPopup('none', `${NW.familyIcon(f)} ${f.name}！`, '拆到隐藏款', 3, '#ffe07a')
		}
	} else {
		NW.FAM.forEach((f, i) => { if (probs[i] > 0) j.fam[f.id] = j.fam[f.id].add(T.times(probs[i])) })
		j.last = `一口气拆出 ${format(T)} 位家族成员，按概率分进了全家福。`
	}
	j.opened = j.opened.add(n)
}
NW.famEff = function (id) {
	const c = player.j.fam[id]
	if (!c || c.lte(0)) return null
	const f = NW.FAM.find(x => x.id === id)
	if (!f.k) return null
	return NW.lp(c, f.k)
}
NW.famTypes = function () { let t = 0; for (const f of NW.FAM) if (player.j.fam[f.id].gte(1)) t++; return t }
NW.eggRate = function () {
	if (player.j.points.lte(0)) return nd(0)
	return player.j.points.pow(0.8).times(NW.mult('egg'))
}
NW.famTable = function () {
	const p = NW.famProbs()
	let h = '<table class="famTable"><tr><th></th><th>成员</th><th>数量</th><th>概率</th><th>加成</th></tr>'
	NW.FAM.forEach((f, i) => {
		const c = player.j.fam[f.id]
		const seen = c.gte(1) || !f.hidden
		let eff
		if (f.id === 'r') eff = `狂笑 +${(NW.lg(c).toNumber() * 1.5).toFixed(1)} 秒`
		else eff = `${f.what} ×${format(NW.famEff(f.id) || 1)}`
		h += seen
			? `<tr><td class="famIcon">${NW.familyIcon(f)}</td><td>${f.name}${f.hidden ? '<small>（隐藏款）</small>' : ''}</td><td>${formatWhole(c)}</td><td>${NW.pct(p[i])}</td><td>${eff}</td></tr>`
			: `<tr class="famUnknown"><td class="famIcon">❓</td><td>？？？</td><td>0</td><td>${NW.pct(p[i])}</td><td>拆到才知道</td></tr>`
	})
	return h + '</table>'
}

NW.familyIcon = f => NW.art.img(f.id, true)
NW.lastBoxDisplay = function(text) {
	let safe = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
	for (const f of NW.FAM) safe = safe.replace(new RegExp(`(?:${f.icon} )?${f.name}(?=×)`, 'g'), () => NW.familyIcon(f) + ' ' + f.name)
	return safe
}

addLayer('j', {
	name: '奶鸡', symbol: NW.art.img('chicken'), position: 0, row: 1,
	color: '#ffe07a', branches: ['w'],
	resource: '奶鸡', baseResource: '奶蛙',
	baseAmount() { return player.w.points },
	requires: nd(100), type: 'normal', exponent: 0.5,
	softcap: nd(1e12), softcapPower: 0.5,
	startData() {
		return {
			unlocked: false, points: nd(0), best: nd(0), total: nd(0), eggs: nd(0), opened: nd(0), last: '', autoOpen: true,
			fam: { m: nd(0), g: nd(0), c: nd(0), r: nd(0), f: nd(0), e: nd(0), x: nd(0), s: nd(0) },

// ================= 立牌：流动的奶龙立牌 =================
NW.nbr = function (i) {
	const r = Math.floor(i / 6), c = i % 6, out = []
	if (r > 0) out.push(i - 6)
	if (r < 3) out.push(i + 6)
	if (c > 0) out.push(i - 1)
	if (c < 5) out.push(i + 1)
	return out
}
NW.schoolSum = function (t) {
	let s = nd(0)
	const ck = player.s.ck
	for (let i = 0; i < 24; i++) if (NW.SCHOOLS[i].t === t) s = s.add(ck[i])
	return s
}
NW.schoolEff = function (t) { return player.s.unlocked ? NW.lp(NW.schoolSum(t), 1) : nd(1) }
NW.visited = function () { let n = 0; for (let i = 0; i < 24; i++) if (player.s.ck[i].gt(0)) n++; return Math.max(1, n) }
NW.totalCk = function () { let s = nd(0); for (let i = 0; i < 24; i++) s = s.add(player.s.ck[i]); return s }
NW.pinMax = function () {
	return 1 + (NW.u('s', 12) ? 1 : 0) + (NW.u('s', 21) ? 1 : 0) + (NW.ch('l', 15) ? 1 : 0) + Math.floor(NW.stars(34) / 3) + (NW.card(4) ? 1 : 0)
}
NW.pinUsed = function () { return player.s.pin.filter(x => x).length }
NW.movePeriod = function () { return 30 * (NW.u('s', 13) ? 0.5 : 1) * Math.pow(0.9, NW.stars(42)) * (NW.card(4) ? 0.5 : 1) }
NW.sTick = function (diff) {
	const s = player.s
	const S = Math.min(200, s.points.toNumber())
	if (s.pos.length !== S) {
		const pos = s.pos.slice(0, S), pin = s.pin.slice(0, S)
		while (pos.length < S) { pos.push(s.drop); pin.push(false) }
		s.pos = pos; s.pin = pin
	}
	if (S === 0 || NW.inC('l', 15)) return
	const rate = NW.mult('ck'), pinM = NW.u('s', 21) ? 2 : 1
	const ck = s.ck.slice()
	for (let i = 0; i < s.pos.length; i++) ck[s.pos[i]] = ck[s.pos[i]].add(rate.times(diff * (s.pin[i] ? pinM : 1)))
	s.acc += diff
	const P = NW.movePeriod()
	if (s.acc >= P) {
		let k = Math.floor(s.acc / P)
		s.acc -= k * P
		k = Math.min(k, 20)
		const pos = s.pos.slice()
		for (let m = 0; m < k; m++) for (let i = 0; i < pos.length; i++) {
			if (s.pin[i]) continue
			pos[i] = NW.pick(NW.nbr(pos[i]))
			if (NW.u('s', 13)) ck[pos[i]] = ck[pos[i]].add(rate.times(10))
		}
		s.pos = pos
		s.moves += k
	}
	s.ck = ck
}
NW.cellClick = function (i) {
	const s = player.s
	if (s.mode === 'drop') { s.drop = i; return }
	const here = []
	s.pos.forEach((p, k) => { if (p === i) here.push(k) })
	const pin = s.pin.slice()
	const free = here.find(k => !pin[k]), pinned = here.find(k => pin[k])
	if (free !== undefined && NW.pinUsed() < NW.pinMax()) pin[free] = true
	else if (pinned !== undefined) pin[pinned] = false
	s.pin = pin
}

NW.colorIdx = function () {
	if (NW.inC('l', 16)) return 6
	if (NW.u('l', 15) && player.l.lock >= 0) return player.l.lock
	return player.l.ci
}
NW.colorPeriod = function () { return 60 }
NW.colorBase = function () {
	if (!player.l.unlocked) return nd(1)
	let e = NW.lp(player.l.points, 2).times(NW.mult('color'))
	let p = 1 + 0.03 * NW.stars(23)
	if (NW.ch('l', 16)) p *= 1.25
	return e.pow(p)
}
NW.colorEff = function (i) {
	if (!player.l.unlocked) return null
	const b = NW.colorBase()
	let r
	if (NW.colorIdx() === i) r = b
	else if (NW.u('l', 13)) r = b.pow(0.2)
	else return null
	return i === 6 ? r.pow(0.5) : r
}
NW.lTick = function (diff) {
	const l = player.l
	if (l.cc > 0) l.cc = Math.max(0, l.cc - diff)
	l.ct += diff
	const P = NW.colorPeriod()
	if (l.ct >= P) {
		const k = Math.floor(l.ct / P)
		l.ct -= k * P
		l.ci = (l.ci + k) % 7
	}
	l.seen |= 1 << NW.colorIdx()
}

NW.hallUnlocked = function (h) {

	if (h === 2) return t >= 8
	if (h === 3) return t >= 25
	return t >= 45 && (player.n.unlocked || player.k.unlocked || player.d.unlocked)
}
NW.workCost = function (w, s) {
	const base = [0, 1, 300, 1e6, 1e12][w.h]
	let c = nd(base).times(Decimal.pow(2.5, w.j)).times(Decimal.pow(5, nd(s).pow(1.25)))
	if (w.j === 0 && NW.u('l', 25)) c = c.div(100)
	return c
}
NW.workStars = function (s) { return '★'.repeat(s) + '☆'.repeat(7 - s) }

NW.filmDur = function () { return 60 * (NW.u('n', 13) ? 0.5 : 1) }
NW.hotMult = function () { return NW.card(7) ? 5 : 3 }
NW.tasteTick = function (diff) {
	const n = player.n
	n.tt += diff
	if (n.tt >= 300) {
		n.tt = n.tt % 300
		n.hot = n.nhot
		n.cold = n.ncold
		n.nhot = Math.floor(NW.rnd() * 6)
		do { n.ncold = Math.floor(NW.rnd() * 6) } while (n.ncold === n.nhot)
	}
}
NW.startFilm = function (g) {
	const n = player.n
	if (n.prod || n.points.lt(1)) return
	n.prod = true; n.t = 0; n.genre = g; n.invest = n.points; n.points = nd(0); n.mama = 0
}
NW.mama = function () {
	const n = player.n
	if (!n.prod || n.mama) return
	n.mama = n.genre === 1 ? 1 : -1
	n.mamas++
}
NW.finishFilm = function () {
	const n = player.n
	let r = 5 + Math.floor(NW.rnd() * 5) - 2
	if (NW.u('n', 12)) r += 1
	if (n.genre === n.hot) r += 2
	if (n.genre === n.cold) r -= 2
	r += n.mama > 0 ? 2 : n.mama < 0 ? -1 : 0
	if (NW.u('n', 22) && n.genre === n.lastG) r += 1
	r += Math.floor(NW.vlv(15) / 2)
	r = Math.max(1, Math.min(10, r))
	let box = n.invest.times(r * r * 2).times(NW.mult('box'))
	if (n.genre === n.hot) box = box.times(NW.hotMult())
	if (n.genre === n.cold) box = box.times(0.3)
	if (r === 10 && NW.u('n', 21)) box = box.times(3)
	n.box = n.box.add(box)
	n.films++
	n.bestR = Math.max(n.bestR, r)
	const G = NW.GENRES[n.genre]
	const title = G.t[n.films % G.t.length] + (n.genre === n.lastG ? ' ' + (n.chain + 2) : '')
	n.chain = n.genre === n.lastG ? n.chain + 1 : 0
	n.lastG = n.genre
	n.log = [`${G.i}《${title}》 菊瓣 ${'🌼'.repeat(Math.ceil(r / 2))} ${r} 分，票房 ${format(box)}`].concat(n.log).slice(0, 5)
	n.prod = false
	n.invest = nd(0)
}
NW.nTick = function (diff) {
	const n = player.n
	NW.tasteTick(diff)
	let left = diff
	for (let i = 0; i < 20; i++) {
		if (!n.prod) {
			if (NW.u('n', 15) && n.auto && n.points.gte(1)) {
				NW.startFilm(NW.card(7) ? n.hot : n.genre)
				if (n.genre === 1) NW.mama()
			} else break
		}
		const need = NW.filmDur() - n.t
		if (left < need) { n.t += left; break }
		left -= need
		NW.finishFilm()
	}
}

NW.window = function () { return 2000 + 1500 * player.d.points.toNumber() + (NW.u('d', 11) ? 2000 : 0) + (NW.u('d', 15) ? 4000 : 0) }
NW.used = function () { let t = 0; for (const id of player.d.eq) t += NW.CARD[id].tok; return t }
NW.toggleCard = function (id) {
	const d = player.d
	if (d.eq.includes(id)) { d.eq = d.eq.filter(x => x !== id); return }
	if (NW.used() + NW.CARD[id].tok > NW.window()) return
	d.eq = d.eq.concat([id])
}
NW.trimCards = function () {
	const d = player.d
	while (d.eq.length && NW.used() > NW.window()) d.eq = d.eq.slice(0, -1)
}

NW.riceCap = function () { return player.k.points.max(1).times(NW.mult('rice')) }
NW.riceG = function () { return 0.04 * (NW.u('k', 11) ? 2 : 1) * (NW.card(8) ? 3 : 1) }
NW.riceSeed = function () { return NW.u('k', 12) ? 0.05 : 0.01 }
NW.kTick = function (diff) {
	const k = player.k
	if (k.points.lte(0) && k.frac <= 0) return
	if (k.frac <= 0) k.frac = NW.riceSeed()
	const g = NW.riceG()
	k.frac = 1 / (1 + (1 / k.frac - 1) * Math.exp(-g * diff))
	if (NW.u('k', 15) && k.auto && k.frac >= 0.9) { NW.eat(); NW.fertilize() }
}
NW.eat = function () {
	const k = player.k
	const rice = NW.riceCap().times(k.frac)
	if (rice.lt(1)) return
	k.fat = k.fat.add(rice.pow(0.5).times(NW.mult('fat')))
	k.poop = k.poop.add(rice.pow(0.3))
	k.frac = NW.riceSeed()
	k.eats++
}
NW.fertilize = function () { const k = player.k; k.fert = k.fert.add(k.poop); k.poop = nd(0) }
NW.poopBox = function () {
	const k = player.k
	if (k.poop.lt(1)) return
	NW.openBoxes(k.poop.times(10), 10, true)
	k.poop = nd(0)
	k.boxes++
}

<script>

NW.foundCount = function () { return Object.keys(player.x.found).filter(k => player.x.found[k] > 0).length }
NW.totalLv = function () { let t = 0; for (const k in player.x.found) t += player.x.found[k]; return t }
NW.genCost = function () { const f = NW.foundCount(); return nd(10).times(Decimal.pow(6, f)).times(Decimal.pow(2, NW.totalLv() - f)) }
NW.kwClick = function (i) {
	const x = player.x
	if (x.A < 0) x.A = i
	else if (x.B < 0) x.B = i
	else { x.A = x.B; x.B = i }
}
NW.generate = function () {
	const x = player.x
	if (x.A < 0 || x.B < 0) return
	const c = NW.genCost()
	if (x.points.lt(c)) return
	const v = NW.recipe(x.A, x.B)
	x.gens++
	if (!v || (x.found[v.id] || 0) >= 5) {
		x.points = x.points.sub(c.div(2))
		if (!v) { x.fails++; x.msg = '图崩了：' + NW.FAILS[x.fails % NW.FAILS.length] + '（退回一半畸变点）' }
		else x.msg = `「${v.n}」已经 5 级了，再画也画不出新花样。（退回一半畸变点）`
		return
	}
	x.points = x.points.sub(c)
	const first = !x.found[v.id]
	x.found = Object.assign({}, x.found, { [v.id]: (x.found[v.id] || 0) + 1 })
	x.msg = first ? `新变体：「${v.n}」！${v.d}` : `「${v.n}」升到了 ${x.found[v.id]} 级。`
	if (first) doPopup('none', v.n, '发现新变体', 3, '#ff8fd8')
}
NW.hintText = function () {
	for (const v of NW.VARIANTS) if (!player.x.found[v.id]) return `豆包翻了翻笔记：有一个配方里含有「${NW.KW[v.a]}」……`
	return '豆包：所有配方都记下来了。'
}
NW.gallery = function () {
	let h = '<div class="gallery">'
	for (const v of NW.VARIANTS) {
		const lv = player.x.found[v.id] || 0
		h += lv ? `<div class="var on"><b>${v.n}</b><small>${NW.KW[v.a]} + ${NW.KW[v.b]}</small><span>Lv.${lv}　${v.d}</span></div>`
			: '<div class="var"><b>？？？</b><small>未发现</small></div>'
	}
	return h + '</div>'
}

	},

		['display-text', () => '<span class="hint">选两个关键词，让 AI 画一只“奶蛙风格”的图。配方对了会出新变体，不对就会画崩。</span>'],

	if (a >= 1e8) return (a / 1e8).toFixed(a >= 1.39e9 ? 4 : 2) + ' 亿'

	<script>
var tmp = {}
var temp = tmp // Proxy for tmp
var funcs = {}
var NaNalert = false;

// Tmp will not call these
var activeFunctions = [
	"startData", "onPrestige", "doReset", "update", "automate",
	"buy", "buyMax", "respec", "onPress", "onClick", "onHold", "masterButtonPress",
	"sellOne", "sellAll", "pay", "actualCostFunction", "actualEffectFunction",
	"effectDescription", "display", "fullDisplay", "effectDisplay", "rewardDisplay",
	"tabFormat", "content",
	"onComplete", "onPurchase", "onEnter", "onExit", "done",
	"getUnlocked", "getStyle", "getCanClick", "getTitle", "getDisplay"
]

var noCall = doNotCallTheseFunctionsEveryTick
for (const item in noCall) {
	activeFunctions.push(noCall[item])
}

// Add the names of classes to traverse
var traversableClasses = []
// Each funcs subtree has its own plan, so purchases and visible tabs can refresh independently.
const tempPlans = new WeakMap()

function setupTemp() {
	tmp = {}
	tmp.pointGen = {}
	tmp.backgroundStyle = {}
	tmp.displayThings = []
	tmp.scrolled = 0
	tmp.gameEnded = false
	funcs = {}
	
	setupTempData(layers, tmp, funcs)
	for (const layer in layers){
		tmp[layer].resetGain = {}
		tmp[layer].nextAt = {}
		tmp[layer].nextAtDisp = {}
		tmp[layer].canReset = {}
		tmp[layer].notify = {}
		tmp[layer].prestigeNotify = {}
		tmp[layer].computedNodeStyle = []
		setupBuyables(layer)
		tmp[layer].trueGlowColor = []
	}

	tmp.other = {
		lastPoints: player.points || decimalZero,
		oomps: decimalZero,
		screenWidth: 0,
		screenHeight: 0,
    }

	updateWidth()

	temp = tmp
}

const boolNames = ["unlocked", "deactivated"]

function setupTempData(layerData, tmpData, funcsData) {
	for (const item in layerData){
		if (layerData[item] == null) {
			tmpData[item] = null
		}
		else if (layerData[item] instanceof Decimal)
			tmpData[item] = layerData[item]
		else if (Array.isArray(layerData[item])) {
			tmpData[item] = []
			funcsData[item] = []
			setupTempData(layerData[item], tmpData[item], funcsData[item])
		}
		else if ((!!layerData[item]) && (layerData[item].constructor === Object)) {
			tmpData[item] = {}
			funcsData[item] = {}
			setupTempData(layerData[item], tmpData[item], funcsData[item])
		}
		else if ((!!layerData[item]) && (typeof layerData[item] === "object") && traversableClasses.includes(layerData[item].constructor.name)) {
			tmpData[item] = new layerData[item].constructor()
			funcsData[item] = new layerData[item].constructor()
		}
		else if (isFunction(layerData[item]) && !activeFunctions.includes(item)){
			funcsData[item] = layerData[item]
			if (boolNames.includes(item))
				tmpData[item] = false
			else
				tmpData[item] = decimalOne // The safest thing to put probably?
		} else {
			tmpData[item] = layerData[item]
		}
	}	
}


function updateTemp() {
	if (tmp === undefined)
		setupTemp()

	updateTempData(layers, tmp, funcs)

	for (const layer in layers){
		tmp[layer].resetGain = getResetGain(layer)
		tmp[layer].nextAt = getNextAt(layer)
		// Only static buy-max and mod overrides distinguish the display threshold.
		tmp[layer].nextAtDisp = layers[layer].getNextAt !== undefined ||
			(tmp[layer].type === "static" && tmp[layer].canBuyMax) ? getNextAt(layer, true) : tmp[layer].nextAt
		tmp[layer].canReset = canReset(layer)
		tmp[layer].trueGlowColor = tmp[layer].glowColor
		tmp[layer].notify = shouldNotify(layer)
		tmp[layer].prestigeNotify = prestigeNotify(layer)
		if (tmp[layer].passiveGeneration === true) tmp[layer].passiveGeneration = 1 // new Decimal(true) = decimalZero

	}

	tmp.pointGen = getPointGen()
	tmp.backgroundStyle = readData(backgroundStyle)

	tmp.displayThings = []
	for (const thing in displayThings){
		let text = displayThings[thing]
		if (isFunction(text)) text = text()
		tmp.displayThings.push(text) 
	}
}

function getTempPlan(layerData, funcsData) {
	let plan = tempPlans.get(funcsData)
	if (plan) return plan
	plan = []
	for (const key in funcsData) {
		const value = layerData[key]
		if (typeof value === 'function') plan.push({key, children: null})
		else if (value && typeof value === 'object') {
			if (Array.isArray(value) && (key === 'tabFormat' || key === 'content')) continue
			const children = getTempPlan(value, funcsData[key])
			if (children.length) plan.push({key, children})
		}
	}
	tempPlans.set(funcsData, plan)
	return plan
}

function applyTempPlan(source, target, plan, useThis) {
	for (const {key, children} of plan) {
		const value = source[key]
		if (children) {
			if (value && target[key]) applyTempPlan(value, target[key], children, useThis)
		} else if (typeof value === 'function') {
			const previous = target[key]
			if (typeof previous === 'function') continue
			const next = value.call(useThis === undefined ? source : useThis)
			if (next !== previous || !(key in target)) Vue.set(target, key, next)
		}
	}
}

function updateTempData(layerData, tmpData, funcsData, useThis) {
	if (funcsData && layerData && tmpData) applyTempPlan(layerData, tmpData, getTempPlan(layerData, funcsData), useThis)
}

function updateChallengeTemp(layer)
{
	updateTempData(layers[layer].challenges, tmp[layer].challenges, funcs[layer].challenges)
}


function updateBuyableTemp(layer)
{
	updateTempData(layers[layer].buyables, tmp[layer].buyables, funcs[layer].buyables)
}

function updateClickableTemp(layer)
{
	updateTempData(layers[layer].clickables, tmp[layer].clickables, funcs[layer].clickables)
}

function buyableCostAt(x) {
	return layers[this.layer].buyables[this.id].actualCostFunction(x === undefined ? player[this.layer].buyables[this.id] : x)
}

function buyableEffectAt(x) {
	return layers[this.layer].buyables[this.id].actualEffectFunction(x === undefined ? player[this.layer].buyables[this.id] : x)
}

function setupBuyables(layer) {
	for (const id in layers[layer].buyables) {
		if (isPlainObject(layers[layer].buyables[id])) {
			let b = layers[layer].buyables[id]
			if (typeof b.cost === 'function' && b.cost !== buyableCostAt) {
				b.actualCostFunction = b.cost
				b.cost = buyableCostAt
			}
			if (typeof b.effect === 'function' && b.effect !== buyableEffectAt) {
				b.actualEffectFunction = b.effect
				b.effect = buyableEffectAt
			}
		}
	}
}

function checkDecimalNaN(x) {
	return (x instanceof Decimal) && x.isNan()
}

}

function achievementStyle(layer, id){
    ach = tmp[layer].achievements[id]
    let style = []
    if (ach.image){ 
        style.push({'background-image': 'url("' + ach.image + '")'})
    } 
    if (!hasAchievement(layer, id)) style.push({'visibility': 'hidden'})
    style.push(ach.style)
    return style
}



function updateWidth() {
	let screenWidth = window.innerWidth
	let splitScreen = screenWidth >= 1024
	if (options.forceOneTab) splitScreen = false
	if (player.navTab == "none") splitScreen = true
	tmp.other.screenWidth = screenWidth
	tmp.other.screenHeight = window.innerHeight

	tmp.other.splitScreen = splitScreen
	tmp.other.lastPoints = player.points
}

function updateOomps(diff)
{
	tmp.other.oompsMag = 0
	if (player.points.lte(new Decimal(1e100)) || diff == 0) return

	var pp = new Decimal(player.points);
	var lp = tmp.other.lastPoints || new Decimal(0);
	if (pp.gt(lp)) {
		if (pp.gte("10^^8")) {
			pp = pp.slog(1e10)
			lp = lp.slog(1e10)
			tmp.other.oomps = pp.sub(lp).div(diff)
			tmp.other.oompsMag = -1;
		} else {
			while (pp.div(lp).log(10).div(diff).gte("100") && tmp.other.oompsMag <= 5 && lp.gt(0)) {
				pp = pp.log(10)
				lp = lp.log(10)
				tmp.other.oomps = pp.sub(lp).div(diff)
				tmp.other.oompsMag++;
			}
		}
	}

}

function constructBarStyle(layer, id) {
	let bar = tmp[layer].bars[id]
	let style = {}

	let tempProgress
	if (bar.progress instanceof Decimal)
		tempProgress = (1 -Math.min(Math.max(bar.progress.toNumber(), 0), 1)) * 100
	else
		tempProgress = (1 -Math.min(Math.max(bar.progress, 0), 1)) * 100

	style.dims = {'width': bar.width + "px", 'height': bar.height + "px"}
	let dir = bar.direction
	style.fillDims = {'width': (bar.width + 0.5) + "px", 'height': (bar.height + 0.5)  + "px"}

	switch(bar.direction) {
		case UP:
			style.fillDims['clip-path'] = 'inset(' + tempProgress + '% 0% 0% 0%)'
			style.fillDims.width = bar.width + 1 + 'px'
			break;
		case DOWN:
			style.fillDims['clip-path'] = 'inset(0% 0% ' + tempProgress + '% 0%)'
			style.fillDims.width = bar.width + 1 + 'px'

			break;
		case RIGHT:
			style.fillDims['clip-path'] = 'inset(0% ' + tempProgress + '% 0% 0%)'
			break;
		case LEFT:
			style.fillDims['clip-path'] = 'inset(0% 0% 0% ' + tempProgress + '%)'
			break;
		case DEFAULT:
			style.fillDims['clip-path'] = 'inset(0% 50% 0% 0%)'
	}

	if (bar.instant) {
		style.fillDims['transition-duration'] = '0s'
	}
	return style
}

function constructTabFormat(layer, id, family){
	let tabTemp, tabLayer, tabFunc, location, key
	if (id === undefined){
		tabTemp = tmp[layer].tabFormat
		tabLayer = layers[layer].tabFormat
		tabFunc = funcs[layer].tabFormat
		location = tmp[layer]
		key = "tabFormat"
	}
	else if (family === undefined) {
		tabTemp = tmp[layer].tabFormat[id].content
		tabLayer = layers[layer].tabFormat[id].content
		tabFunc = funcs[layer].tabFormat[id].content
		location = tmp[layer].tabFormat[id]
		key = "content"

	}
	else {
		tabTemp = tmp[layer].microtabs[family][id].content
		tabLayer = layers[layer].microtabs[family][id].content
		tabFunc = funcs[layer].microtabs[family][id].content
		location = tmp[layer].microtabs[family][id]
		key = "tabFormat"

	}
	if (isFunction(tabLayer)) {
		return tabLayer.bind(location)()
	}
	updateTempData(tabLayer, tabTemp, tabFunc, {layer, id, family})
	return tabTemp
}

function updateTabFormats() {
	updateTabFormat(player.tab)
	updateTabFormat(player.navTab)
}

function updateTabFormat(layer) {
	if (layers[layer]?.tabFormat === undefined) return

	let tab = player.subtabs[layer]?.mainTabs
	if (isFunction(layers[layer].tabFormat)) {
		Vue.set(temp[layer], 'tabFormat', layers[layer].tabFormat())
	}
	else if (Array.isArray(layers[layer].tabFormat)) {
		Vue.set(temp[layer], 'tabFormat', constructTabFormat(layer))
	}
	else if (isPlainObject(layers[layer].tabFormat)) {
		if (layers[layer].tabFormat[tab].embedLayer === undefined)
		Vue.set(temp[layer].tabFormat[tab], 'content', constructTabFormat(layer, tab))
	}

	// Check for embedded layer
	if (isPlainObject(tmp[layer].tabFormat) && tmp[layer].tabFormat[tab].embedLayer !== undefined) { 
		updateTabFormat(tmp[layer].tabFormat[tab].embedLayer)
	}

	// Update microtabs
	for (family in layers[layer].microtabs) {
		tab = player.subtabs[layer][family]

		if (tmp[layer].microtabs[family][tab]) {

			if (tmp[layer].microtabs[family][tab].embedLayer)
				updateTabFormat(tmp[layer].microtabs[family][tab].embedLayer)
			else
				Vue.set(temp[layer].microtabs[family][tab], 'content', constructTabFormat(layer, tab, family))
		}
	}
}
