	<title>奶蛙树</title>
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B8%3C/text%3E%3C/svg%3E">

	<style>
/* ==========================================================================
   Design tokens that don't depend on the active theme.
   Theme-dependent tokens live on <body> in general-style.css, because the

   ========================================================================== */
/* ==========================================================================
   Design tokens that don't depend on the active theme.
   Theme colours live on <body> (general-style.css) because themes.js writes
   them there.
   ========================================================================== */
:root {
	--font-serif: "Crimson Pro", "Noto Serif SC", "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", "STSong", "SimSun", Georgia, "Times New Roman", serif;

	--ink: #101830;                /* text on bright, layer-coloured surfaces */
	--jade: #74d0a2;               /* bought / done */
	--amber: #f2bd55;              /* challenge can be completed */
	--rose: #ff8f9c;               /* destructive */

	--gloss: linear-gradient(180deg, rgba(255, 255, 255, 0.32), rgba(255, 255, 255, 0) 55%),
	         linear-gradient(0deg, rgba(0, 0, 0, 0.14), rgba(0, 0, 0, 0) 42%);
	--lift: inset 0 1px 0 rgba(255, 255, 255, 0.4), inset 0 -2px 0 rgba(0, 0, 0, 0.12), 0 16px 30px -18px rgba(0, 0, 0, 0.95);
	--lift-dim: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 14px 28px -20px rgba(0, 0, 0, 0.95);
	--ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}

* {
	transition-duration: 0.5s;
	transition-timing-function: var(--ease);
	text-align: center;
	font-family: var(--font-serif);
	font-weight: 500;
	table-align: center;
	margin: auto;
	-webkit-text-size-adjust: none;
	text-size-adjust: none;

}

*:focus {
	outline: none;
	webkit-outline: none;
}

/* Keyboard users still get a visible focus ring (mouse clicks don't trigger it) */
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, .link:focus-visible {
	outline: 2px solid var(--points);
	outline-offset: 3px;
}

::selection {
	background: var(--glow-soft, rgba(255, 217, 138, 0.3));
	color: var(--points);
}

html, body {
	min-height: 100%;
	height: 100%;
}

td {
	padding: 0
}

.upgTable {
	display: flex !important;
	flex-flow: column wrap;
	justify-content: center;
	align-items: center;
	max-width: 100%;
	margin: 0 auto;
}

.upgRow {
	display: flex !important;
	flex-flow: row wrap;
	justify-content: center;
	align-items: center;
	max-width: 100%;
	margin: 0 auto;
}

.upgAlign {
	vertical-align: 0
}

.bigUpgAlign {
	vertical-align: 0
}

.treeThing {
	margin: 0 10px 0 10px;
	vertical-align: middle;
}

.can.upg:hover {
	z-index: 2
}

.can.buyable:hover {
	z-index: 2
}

/* Round glass back buttons */
.back, .other-back {
	position: absolute;
	top: 10px;
	width: 40px;
	height: 40px;
	padding: 0;
	border-radius: 50%;
	border: 1px solid var(--hairline);
	background-color: var(--glass);
	-webkit-backdrop-filter: blur(8px);
	backdrop-filter: blur(8px);
	box-shadow: var(--lift-dim);
	color: var(--color);
	font-size: 22px;
	line-height: 1;
	cursor: pointer;
	transition-duration: 0.25s;
}

.back {
	left: 12px;
	top: 12px;
}

.other-back {
	left: 70px;
	top: 12px;
}

.back:hover, .other-back:hover {
	transform: translateX(-2px);
	border-color: var(--glow);
	color: var(--points);
	box-shadow: var(--lift-dim), 0 0 22px -6px var(--glow);
}

.hidden {
	visibility: hidden;
	height: 50px !important;
}

.canvas {
	top: 0;
	left: 0;
	position: absolute;
	z-index: -999;
}

.left {
	position: absolute;
	left: 0;
}

.remove {
	height: 24px;
	width: 24px;
	cursor: pointer;
}

.remove:hover {
	transform: scale(1.1, 1.1);
}

.col {
	min-width: 49.5%;
	max-width: 49.5%;
	width: 49.5%;
	height: 100%;
	min-height: 100%;
	column-span: 1;
	position: absolute;
	overflow-y: auto;
	overflow-x: auto;
	transition-duration: 0s
}

.instant {
	transition-duration: 0s !important
}

.fast {
	transition:color none
}

.col.right {
	top: 0;
	right: 0;
}

#app {
	column-count: 2;
	column-width: 50%;
	min-height: 100%;
}

.vl2 {
	border-left: 1px solid var(--hairline-strong);
	height: 100%;
}

ul {
	list-style-type: none;
}

.fullWidth {
	position: absolute;
	height: 100%;
	width: 100%;
	min-width: 100%;
	overflow-y: auto;
	overflow-x: auto;
	transition-duration: 0s
}

/* Quiet scrollbars that sit inside the night sky */
.col, .fullWidth, .treeOverlay {
	scrollbar-width: thin;
	scrollbar-color: var(--hairline-strong) transparent;
}

::-webkit-scrollbar {
	width: 10px;
	height: 10px;
}

::-webkit-scrollbar-track {
	background: transparent;
}

::-webkit-scrollbar-thumb {
	background-color: var(--hairline-strong);
	border: 3px solid transparent;
	border-radius: 10px;
	background-clip: padding-box;
}

::-webkit-scrollbar-corner {
	background: transparent;
}

.tooltipBox { 
	position: relative;
  }
  
  .tooltipBox:hover .tooltip{
	opacity: 1;
	transform: translateX(-50%) translateY(0);
  }

  .forceTooltip .tooltip{
	opacity: 1;
	transform: translateX(-50%) translateY(0);
  }
  
.respecCheckbox {
	display: inline-block;
}


#loadingSection {
	display: flex;
	flex-direction: column;
	justify-content: center;
}

.treeOverlay {
	pointer-events:none;
	overflow:hidden;
}

.front {
	z-index: 30000
}

.overlayThing {
	z-index: 10000;
	pointer-events:auto;
}

.sideLayers {
	z-index: 10000;
	pointer-events:auto;
	position: absolute;
	right: 55px;
	top: 65px;
	background-color: transparent;
}

button > * {
	pointer-events:none;
}

.ghost {
	visibility: hidden
}

#treeTab td button {
    margin: 0 10px;
}

.bg {
	z-index: -9000;
	width: 100%;
	height: 100%;
	position: absolute;
	background-color: transparent;
	top: 0
}

.bg2 {
	z-index: -9009;
	width: 100%;
	height: 100%;
	position: absolute;
	top: 0
}

.noBackground {
	background: transparent !important;
	background-image: none !important;
	--background: transparent !important;
}

/* Horizontal rules (h-line component) become a soft seam of light */
hr {
	border: 0;
	height: 2px;
	margin: 10px auto;
	background: linear-gradient(90deg, transparent, var(--hairline-strong) 18%, var(--hairline-strong) 82%, transparent);
}

/* Text inputs, sliders and drop-downs used by mods */
input, select, textarea {
	font-family: var(--font-serif);
	font-size: 16px;
	color: var(--color);
	background-color: var(--glass);
	border: 1px solid var(--hairline);
	border-radius: 10px;
	padding: 6px 10px;
	transition-duration: 0.2s;
}

input:focus, select:focus, textarea:focus {
	border-color: var(--glow);
	box-shadow: 0 0 0 3px var(--glow-soft);
}

select option {
	background-color: var(--night);
	color: var(--color);
}

input[type="checkbox"], input[type="radio"], input[type="range"] {
	accent-color: var(--points);
	background: none;
	border: 0;
	padding: 0;
	box-shadow: none;
}

input[type="checkbox"] {
	width: 16px;
	height: 16px;
	cursor: pointer;
}

/* Motion is decorative only; switch it off for people who ask */
@media (prefers-reduced-motion: reduce) {
	*, *::before, *::after {
		animation: none !important;
		transition-duration: 0s !important;
	}
}

</style>
	<style>

	<style>
/* ==========================================================================
   Components. Fills still come from each layer (inline styles); these rules
   add the glass, light and hierarchy. --layer-color is set inline on most
   components so unavailable items can still carry a hint of their layer.
   ========================================================================== */

/* ---- Layer resource: "You have / 1,234 / lollipops, which…" ---- */
.mainDisplay {
	margin: 8px auto 20px;
	max-width: 92%;
}

.mainDisplay .mdLabel {
	display: block;
	font-size: 17px;
	font-style: italic;
	color: var(--muted);
}

.mainDisplay h2 {
	display: block;
	font-size: 56px;
	font-weight: 500;
	line-height: 1.05;
	letter-spacing: -0.01em;
	margin: 2px auto 4px;
}

.mainDisplay .mdResource {
	display: block;
	font-size: 19px;
	font-style: italic;
	line-height: 1.35;
}

/* ---- Upgrades ---- */
.upg {
	min-height: 120px;
	width: 120px;
	margin: 4px;
	padding: 10px 8px;
	border-radius: 18px;
	border: 1px solid rgba(255, 255, 255, 0.22);
	font-size: 12.5px;
	line-height: 1.22;
	overflow: visible;
	color: var(--ink);
	background-image: var(--gloss);
	box-shadow: var(--lift);
	transition-duration: 0.25s;
}

.upg.treeThing {
	margin: 0 10px;
}

.upgContent {
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 5px;
}

.upgContent > span {
	display: block;
	margin: 0;
}

.upgTitle h3 {
	font-size: 15px;
	line-height: 1.08;
	font-weight: 700;
}

.upgEffect {
	font-style: italic;
}

.upgCost {
	width: 100%;
	margin-top: 3px !important;
	padding-top: 6px;
	border-top: 1px solid color-mix(in oklab, currentColor 24%, transparent);
	font-size: 12px;
}

/* A small tick tells bought upgrades apart at a glance */
.upg.bought::after {
	content: "";
	position: absolute;
	top: 8px;
	right: 9px;
	width: 13px;
	height: 13px;
	opacity: 0.55;
	background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M3.5 8.5l3 3 6-7' fill='none' stroke='%23101830' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/></svg>") center / contain no-repeat;
}

/* ---- Achievements ---- */
.achievement {
	height: 90px;
	width: 90px;
	margin: 3px;
	border-radius: 20px;
	border: 1px solid rgba(255, 255, 255, 0.22);
	font-size: 12px;
	line-height: 1.15;
	color: white;
	text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
	background-image: var(--gloss);
	box-shadow: var(--lift);
	transition-duration: 0.25s;
}
.achievement:hover {
	box-shadow: var(--lift), 0 0 0 1px var(--glow), 0 0 22px -2px var(--glow);
	transform: translateY(-2px);
	z-index: 7;
}

.achievement {
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 6px;
	box-sizing: border-box;
}

.achievement br {
	display: none;
}

/* Achievement names stay white over any colour or image a mod gives them */
.achievement.bought, .achievement.locked {
	color: white;
}

/* ---- Buyables ---- */
.buyable {
	height: 200px;
	width: 200px;
	padding: 14px;
	border-radius: 26px;
	border: 1px solid rgba(255, 255, 255, 0.22);
	font-size: 13px;
	line-height: 1.3;
	position:relative;
	color: var(--ink);
	background-image: var(--gloss);
	box-shadow: var(--lift);
	transition-duration: 0.25s;
}

.buyable h2, .upg h2 {
	display: inline-block;
	font-size: 22px;
	margin-bottom: 4px;
}

/* ---- Milestones: a checklist ---- */
table:has(td.milestone), table:has(td.milestoneDone) {
	width: min(560px, 94%);
	border-spacing: 0 8px;
}

.milestone, .milestoneDone {
	width: 100%;
	min-width: 120px;
	height: 64px;
	padding: 12px 20px 12px 60px;
	border-radius: 16px;
	font-size: 15px;
	line-height: 1.3;
	text-align: left;
	box-shadow: var(--lift-dim);
}

.milestone {
	background-color: var(--glass);
	border: 1px solid var(--hairline);
	color: var(--muted);
}

.milestoneDone {
	background-color: color-mix(in oklab, var(--jade) 10%, transparent);
	border: 1px solid color-mix(in oklab, var(--jade) 40%, transparent);
	color: var(--color);
}

.milestone *, .milestoneDone * {
	text-align: left;
}

.milestone > br, .milestoneDone > br {
	display: none;
}

.msReq {
	display: block;
	margin: 0;
	font-size: 18px;
	font-weight: 700;
	line-height: 1.15;
}

.msEffect {
	display: block;
	margin: 2px 0 0;
}

.msToggle {
	display: inline-block;
	margin: 8px 6px 0 0;
}

.msToggle button {
	text-align: center;
}

/* Status mark: an empty dashed ring, or a filled jade check */
.milestone::before, .milestoneDone::before {
	content: "";
	position: absolute;
	left: 20px;
	top: 50%;
	width: 24px;
	height: 24px;
	margin-top: -12px;
	box-sizing: border-box;
	border-radius: 50%;
	text-align: center;
}

.milestone::before {
	border: 1.5px dashed var(--hairline-strong);
}

.milestoneDone::before {
	background: var(--jade) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M3.5 8.5l3 3 6-7' fill='none' stroke='%23101830' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/></svg>") center / 15px 15px no-repeat;
	box-shadow: 0 0 14px -2px var(--jade);
}

/* ---- Challenges: title, terms, then the action ---- */
.challenge {
	position: relative;
	box-sizing: border-box;
	width: 300px;
	min-height: 300px;
	height: auto;
	margin: 8px;
	padding: 26px 24px 22px;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: space-between;
	gap: 14px;
	border-radius: 28px;
	border: 1px solid color-mix(in oklab, var(--layer-color, var(--color)) 32%, transparent);
	background-color: var(--glass);
	background-image: radial-gradient(120% 60% at 50% 0%, color-mix(in oklab, var(--layer-color, var(--color)) 16%, transparent), transparent 70%);
	color: var(--color);
	font-size: 15px;
	line-height: 1.35;
	box-shadow: var(--lift-dim);
}

.challenge > * {
	margin: 0;
}

.challenge.locked {
	background-color: var(--glass);
	color: var(--color);
	cursor: default;
}

.chTitle {
	display: block;
	font-size: 28px;
	font-weight: 600;
	line-height: 1.05;
}

.chBody {
	display: flex;
	flex-direction: column;
	gap: 10px;
}

.chBody > span {
	display: block;
	margin: 0;
}

.chDesc {
	font-style: italic;
	color: var(--muted);
}

.chKey {
	display: block;
	font-size: 13px;
	font-style: italic;
	letter-spacing: 0.04em;
	color: var(--gilt);
}

.challenge.done {
	border-color: color-mix(in oklab, var(--jade) 50%, transparent);
	background-image: radial-gradient(120% 60% at 50% 0%, color-mix(in oklab, var(--jade) 20%, transparent), transparent 70%);
}

.challenge.canComplete {
	border-color: var(--amber);
	background-image: radial-gradient(120% 70% at 50% 0%, color-mix(in oklab, var(--amber) 26%, transparent), transparent 75%);
	box-shadow: var(--lift-dim), 0 0 44px -10px var(--amber);
}

/* ---- Infoboxes ---- */
.story {
    width: 600px;
    max-width: 95%;
    border-bottom: solid 2px;
    border-radius: 14px;
    margin-bottom: 14px;
    text-align: left;
}

.story-title {
    text-align: left;
    font-size: 22px;
    font-weight: 600;
    font-style: italic;
    color: var(--ink);
    cursor: pointer;
    border: none;
    padding: 6px 14px;
    border-radius: 12px 12px 0 0;
    background-image: var(--gloss);
}

.story-title span {
    font-family: inherit;
    font-weight: inherit;
}

.story-toggle {
    border: none;
    background: rgba(9, 15, 33, 0.78);
    color: var(--points);
    font-size: 16px;
    font-style: normal;
    line-height: 1.35;
    pointer-events: none;
    width: 1.35em;
    margin-right: 10px;
    border-radius: 6px;
    display: inline-block;
    text-align: center;
}

.story-text {
	padding: 12px 16px;
    border: solid 2px;
    border-color: inherit;
    border-radius: inherit;
    border-top-left-radius: 0;
    margin-bottom: -2px;
    font-size: 17px;
    line-height: 1.55;
    background-color: color-mix(in oklab, var(--night) 72%, transparent);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
}

.story-text, .story-text * {
    text-align: left;
}


/* ---- Tiles are gridables ---- */
.tile {
	height: 80px;
	width: 80px;
	border-radius: 16px;
	border: 1px solid rgba(255, 255, 255, 0.18);
	font-size: 12px;
	overflow: visible;
	color: var(--ink);
	background-image: var(--gloss);
	box-shadow: var(--lift);
	transition-duration: 0.25s;
}

.tile.can:hover {
	box-shadow: var(--lift), 0 0 0 1px var(--glow), 0 0 22px -2px var(--glow);
	transform: translateY(-2px) scale(1.08, 1.08);
	z-index: 7;
}

.upgBig {
	height: 200px;
	width: 200px;
	border-radius: 26px;
	border: 1px solid rgba(255, 255, 255, 0.22);
	color: var(--ink);
	background-image: var(--gloss);
	box-shadow: var(--lift);
}

/* Used for respec button and similar: a gilt capsule */
.longUpg {
	height: 46px;
	width: 132px;
	background-color: var(--points);
	background-image: var(--gloss);
	border-radius: 999px;
	border: 1px solid rgba(255, 255, 255, 0.35);
	font-size: 15px;
	font-weight: 600;
	color: var(--ink);
	box-shadow: var(--lift);
	transition-duration: 0.25s;
}

.smallUpg {
	height: 36px;
	min-width: 52px;
	width: auto;
	padding: 0 12px;
	border-radius: 999px;
	border: 1px solid rgba(255, 255, 255, 0.25);
	font-size: 13px;
	font-weight: 700;
	color: var(--ink);
	background-image: var(--gloss);
	box-shadow: var(--lift);
	transition-duration: 0.2s;
}

/* Unavailable things become dark glass, lit faintly by their layer's colour */
.upg.locked, .buyable.locked, .tile.locked, .upgBig.locked {
	background-color: color-mix(in oklab, var(--locked) 88%, transparent);
	background-image: radial-gradient(120% 70% at 50% 0%, color-mix(in oklab, var(--layer-color, var(--color)) 16%, transparent), transparent 72%);
	border-color: color-mix(in oklab, var(--layer-color, var(--color)) 32%, transparent);
	box-shadow: var(--lift-dim);
}

.longUpg.locked, .achievement.locked {
	background-image: none;
	border-color: var(--hairline);
	box-shadow: var(--lift-dim);
}

</style>
	<style>
/* Global things */
body {
	color: var(--color);
	overflow: hidden;
	font-size: 17px;
	line-height: 1.35;
	font-variant-numeric: lining-nums tabular-nums;
	--background: #0a1226;
	--color: #ebe3cf;
	--points: #f1cd80;
	--locked: #1c2743;
	--background_tooltip: rgba(9, 15, 33, 0.95);

	/* Derived from the active theme (themes.js writes the five colours above
	   onto <body>), so every theme, including ones a mod adds, stays coherent. */
	--night: var(--background);
	--glass: color-mix(in oklab, var(--color) 5%, transparent);

.treeNode {

	width: 100px;

	line-height: 1;
	color: rgba(14, 18, 40, 0.72);

	outline-offset: 9px;
	transition-duration: 0.3s;
}

   tints the orb, only the sky around it. */
.treeNode::before {
	content: "";
	position: absolute;
	top: -24px;
	right: -24px;
	bottom: -24px;
	left: -24px;
	padding: 12px;
	border-radius: 50%;
	background-color: inherit;
	background-clip: content-box;
	filter: blur(12px);
	opacity: 0.45;
	-webkit-mask: radial-gradient(closest-side, transparent calc(100% - 25px), #000 calc(100% - 15px)) no-repeat;
	mask: radial-gradient(closest-side, transparent calc(100% - 25px), #000 calc(100% - 15px)) no-repeat;
	pointer-events: none;
	z-index: -1;
	transition: opacity 0.3s;
}

.treeNode.hidden::before, .treeNode.ghost::before {
	display: none;
}

.treeNode.can:hover::before {
	opacity: 0.8;
}

	color: var(--muted);

}

}

	border-color: rgba(255, 255, 255, 0.16);
	border-radius: 33%;
	box-shadow: var(--hqProperty2a), 0 18px 32px -14px rgba(0, 0, 0, 0.95);
	background-image:
		radial-gradient(110% 80% at 30% 12%, rgba(255, 255, 255, 0.5) 0, rgba(255, 255, 255, 0) 46%),

NW.laughCap = function (g) {
	if (g.lte(1e100)) return g
	let e = g.log10().toNumber()
	const t = NW.laughThresholds(), p = NW.laughPower()
	let out = e
	if (e > t[0]) out = t[0] + (Math.min(e, t[1]) - t[0]) * p
	if (e > t[1]) out += (Math.min(e, t[2]) - t[1]) * p * p
	if (e > t[2]) out += (e - t[2]) * p * p * p
	return Decimal.pow(10, out)
}
NW.laughThresholds = function () {
	let a = 100
	if (NW.u('w', 35)) a += 20
	if (NW.u('z', 13)) a += 60
	return [a, a * 10, a * 100]
}
NW.laughPower = function () { return Math.min(0.9, 0.5 + 0.05 * NW.vlv(16) + (NW.u('m', 15) ? 0.05 : 0)) }
NW.laughLevel = function () {
	const g = NW.rawHa ? NW.rawHa : nd(1)
	const t = NW.laughThresholds()
	const e = g.max(1).log10().toNumber()
	return e > t[2] ? 3 : e > t[1] ? 2 : e > t[0] ? 1 : 0
}

// ================= 奶蛙：戳一下就狂笑 =================
NW.mirthCap = function () {
	let c = 20
	if (NW.u('w', 15)) c -= 8
	c -= NW.stars(25)
	return Math.max(3, c)
}
NW.frenzyDur = function () {
	return 10 + NW.lg(player.j.fam.r).toNumber() * 1.5 + NW.stars(15) * 2
}
NW.chokeDur = function () { return NW.u('w', 23) ? 6 : 15 }
NW.frenzyMult = function () {
	let m = nd(NW.u('w', 14) ? 6 : 3).times(NW.mult('fz'))
	if (NW.card(2)) m = m.pow(1.2)
	return m
}
NW.autoPoke = function () {
	let r = 0
	if (NW.ms('j', 0)) r += 1
	if (NW.ms('s', 0)) r += 1
	if (NW.ms('l', 0)) r += 2
	r += NW.stars(35)
	if (NW.u('l', 24)) r *= 5
	if (NW.ch('l', 12)) r *= 2
	return r
}
NW.frenzyFactor = function () {
	if (NW.inC('l', 12)) return 1
	const w = player.w, m = NW.frenzyMult()
	const ap = NW.autoPoke()
	if (NW.smooth && ap > 0) { // 离线或后台的长帧：按平均狂笑时间折算
		const fill = NW.mirthCap() / (ap * (NW.u('w', 24) ? 2 : 1))
		const dur = NW.frenzyDur(), up = dur / (dur + NW.chokeDur() + fill)
		return m.sub(1).times(up).add(1)
	}
	return w.frenzy > 0 ? m : 1
}
NW.poke = function (n, auto) {
	const w = player.w
	if (NW.inC('l', 12) || w.choke > 0) return false
	w.pokes += n
	w.idle = 0
	if (!auto) player.points = player.points.add(tmp.pointGen.times(0.5 * n).max(n))
	if (w.frenzy > 0) return true
	w.mirth += n * (NW.u('w', 24) ? 2 : 1)
	if (w.mirth >= NW.mirthCap()) {
		w.mirth = 0
		w.frenzy = NW.frenzyDur()
		w.frenzies++
	}
	return true
}
NW.wTick = function (diff) {
	const w = player.w
	NW.smooth = diff > 2
	if (w.frenzy > 0) {
		w.frenzy -= diff
		if (w.frenzy <= 0) { w.frenzy = 0; w.choke = NW.chokeDur() }
	} else if (w.choke > 0) {
		w.choke = Math.max(0, w.choke - diff)
	} else {
		const ap = NW.autoPoke()
		if (ap > 0) {
			w.autoAcc += ap * diff
			const k = Math.floor(w.autoAcc)
			if (k > 0) { w.autoAcc -= k; NW.poke(Math.min(k, 1000), true) }
		} else {
			w.idle += diff
			if (w.idle > 2) w.mirth = Math.max(0, w.mirth - diff)
		}
	}
}
NW.wState = function () {
	const w = player.w
	if (NW.inC('l', 12)) return 'smell'
	return w.frenzy > 0 ? 'frenzy' : w.choke > 0 ? 'choke' : 'calm'
}

NW.famProbs = function (extra) {
	const h = NW.hiddenMult() * (extra || 1)
	const p = NW.FAM.map(f => f.p * (f.hidden ? h : 1))
	let hid = p[6] + p[7]
	if (hid > 0.5) { const k = 0.5 / hid; p[6] *= k; p[7] *= k; hid = 0.5 }
	for (let i = 0; i < 6; i++) p[i] = NW.FAM[i].p / 0.97 * (1 - hid)
	return p
}
NW.openBoxes = function (n, extra, manual) {
	n = nd(n).floor()
	if (n.lte(0)) return
	const j = player.j
	const T = n.times(NW.boxSize())
	const probs = NW.inC('l', 13) ? [1, 0, 0, 0, 0, 0, 0, 0] : NW.famProbs(extra)
	if (T.lt(40)) {
		const k = T.toNumber(), got = {}
		for (let i = 0; i < k; i++) {
			let r = NW.rnd(), idx = 0
			while (idx < 7 && r >= probs[idx]) { r -= probs[idx]; idx++ }
			const f = NW.FAM[idx]
			j.fam[f.id] = j.fam[f.id].add(1)
			got[idx] = (got[idx] || 0) + 1
		}
		j.last = Object.keys(got).map(i => `${NW.FAM[i].icon} ${NW.FAM[i].name}×${got[i]}`).join('　')
		if (manual && (got[6] || got[7])) doPopup('none', got[7] ? '🗿 西格玛奶蛙！' : '🐸 小奶蛙！', '拆到隐藏款', 3, '#ffe07a')
	} else {
		NW.FAM.forEach((f, i) => { if (probs[i] > 0) j.fam[f.id] = j.fam[f.id].add(T.times(probs[i])) })
		j.last = `一口气拆出 ${format(T)} 位家族成员，按概率分进了全家福。`
	}
	j.opened = j.opened.add(n)
}
NW.famEff = function (id) {
	const c = player.j.fam[id]
	if (!c || c.lte(0)) return null
	const f = NW.FAM.find(x => x.id === id)
	if (!f.k) return null
	return NW.lp(c, f.k)
}
NW.famTypes = function () { let t = 0; for (const f of NW.FAM) if (player.j.fam[f.id].gte(1)) t++; return t }
NW.eggRate = function () {
	if (player.j.points.lte(0)) return nd(0)
	return player.j.points.pow(0.8).times(NW.mult('egg'))
}
NW.famTable = function () {
	const p = NW.famProbs()
	let h = '<table class="famTable"><tr><th></th><th>成员</th><th>数量</th><th>概率</th><th>加成</th></tr>'
	NW.FAM.forEach((f, i) => {
		const c = player.j.fam[f.id]
		const seen = c.gte(1) || !f.hidden
		let eff
		if (f.id === 'r') eff = `狂笑 +${(NW.lg(c).toNumber() * 1.5).toFixed(1)} 秒`
		else eff = `${f.what} ×${format(NW.famEff(f.id) || 1)}`
		h += seen
			? `<tr><td class="famIcon">${f.icon}</td><td>${f.name}${f.hidden ? '<small>（隐藏款）</small>' : ''}</td><td>${formatWhole(c)}</td><td>${NW.pct(p[i])}</td><td>${eff}</td></tr>`
			: `<tr class="famUnknown"><td class="famIcon">❓</td><td>？？？</td><td>0</td><td>${NW.pct(p[i])}</td><td>拆到才知道</td></tr>`
	})
	return h + '</table>'
}

// ================= 立牌：流动的奶龙立牌 =================
NW.nbr = function (i) {
	const r = Math.floor(i / 6), c = i % 6, out = []
	if (r > 0) out.push(i - 6)
	if (r < 3) out.push(i + 6)
	if (c > 0) out.push(i - 1)
	if (c < 5) out.push(i + 1)
	return out
}
NW.schoolSum = function (t) {
	let s = nd(0)
	const ck = player.s.ck
	for (let i = 0; i < 24; i++) if (NW.SCHOOLS[i].t === t) s = s.add(ck[i])
	return s
}
NW.schoolEff = function (t) { return player.s.unlocked ? NW.lp(NW.schoolSum(t), 1) : nd(1) }
NW.visited = function () { let n = 0; for (let i = 0; i < 24; i++) if (player.s.ck[i].gt(0)) n++; return Math.max(1, n) }
NW.totalCk = function () { let s = nd(0); for (let i = 0; i < 24; i++) s = s.add(player.s.ck[i]); return s }
NW.pinMax = function () {
	return 1 + (NW.u('s', 12) ? 1 : 0) + (NW.u('s', 21) ? 1 : 0) + (NW.ch('l', 15) ? 1 : 0) + Math.floor(NW.stars(34) / 3) + (NW.card(4) ? 1 : 0)
}
NW.pinUsed = function () { return player.s.pin.filter(x => x).length }
NW.movePeriod = function () { return 30 * (NW.u('s', 13) ? 0.5 : 1) * Math.pow(0.9, NW.stars(42)) * (NW.card(4) ? 0.5 : 1) }
NW.sTick = function (diff) {
	const s = player.s
	const S = Math.min(200, s.points.toNumber())
	if (s.pos.length !== S) {
		const pos = s.pos.slice(0, S), pin = s.pin.slice(0, S)
		while (pos.length < S) { pos.push(s.drop); pin.push(false) }
		s.pos = pos; s.pin = pin
	}
	if (S === 0 || NW.inC('l', 15)) return
	const rate = NW.mult('ck'), pinM = NW.u('s', 21) ? 2 : 1
	const ck = s.ck.slice()
	for (let i = 0; i < s.pos.length; i++) ck[s.pos[i]] = ck[s.pos[i]].add(rate.times(diff * (s.pin[i] ? pinM : 1)))
	s.acc += diff
	const P = NW.movePeriod()
	if (s.acc >= P) {
		let k = Math.floor(s.acc / P)
		s.acc -= k * P
		k = Math.min(k, 20)
		const pos = s.pos.slice()
		for (let m = 0; m < k; m++) for (let i = 0; i < pos.length; i++) {
			if (s.pin[i]) continue
			pos[i] = NW.pick(NW.nbr(pos[i]))
			if (NW.u('s', 13)) ck[pos[i]] = ck[pos[i]].add(rate.times(10))
		}
		s.pos = pos
		s.moves += k
	}
	s.ck = ck
}
NW.cellClick = function (i) {
	const s = player.s
	if (s.mode === 'drop') { s.drop = i; return }
	const here = []
	s.pos.forEach((p, k) => { if (p === i) here.push(k) })
	const pin = s.pin.slice()
	const free = here.find(k => !pin[k]), pinned = here.find(k => pin[k])
	if (free !== undefined && NW.pinUsed() < NW.pinMax()) pin[free] = true
	else if (pinned !== undefined) pin[pinned] = false
	s.pin = pin
}

<script>

// ================= 奶龙：会变色，啥都吃 =================
NW.colorIdx = function () {
	if (NW.inC('l', 16)) return 6
	if (NW.u('l', 15) && player.l.lock >= 0) return player.l.lock
	return player.l.ci
}
NW.colorPeriod = function () { return 60 }
NW.colorBase = function () {
	if (!player.l.unlocked) return nd(1)
	let e = NW.lp(player.l.points, 2).times(NW.mult('color'))
	let p = 1 + 0.03 * NW.stars(23)
	if (NW.ch('l', 16)) p *= 1.25
	return e.pow(p)
}
NW.colorEff = function (i) {
	if (!player.l.unlocked) return null
	const b = NW.colorBase()
	let r
	if (NW.colorIdx() === i) r = b
	else if (NW.u('l', 13)) r = b.pow(0.2)
	else return null
	return i === 6 ? r.pow(0.5) : r
}
NW.lTick = function (diff) {
	const l = player.l
	if (l.cc > 0) l.cc = Math.max(0, l.cc - diff)
	l.ct += diff
	const P = NW.colorPeriod()
	if (l.ct >= P) {
		const k = Math.floor(l.ct / P)
		l.ct -= k * P
		l.ci = (l.ci + k) % 7
	}
	l.seen |= 1 << NW.colorIdx()
}

}
NW.workCost = function (w, s) {
	const base = [0, 1, 300, 1e6, 1e12][w.h]

	if (w.j === 0 && NW.u('l', 25)) c = c.div(100)
	return c
}

NW.filmDur = function () { return 60 * (NW.u('n', 13) ? 0.5 : 1) }
NW.hotMult = function () { return NW.card(7) ? 5 : 3 }
NW.tasteTick = function (diff) {
	const n = player.n
	n.tt += diff
	if (n.tt >= 300) {
		n.tt = n.tt % 300
		n.hot = n.nhot
		n.cold = n.ncold
		n.nhot = Math.floor(NW.rnd() * 6)
		do { n.ncold = Math.floor(NW.rnd() * 6) } while (n.ncold === n.nhot)
	}
}
NW.startFilm = function (g) {
	const n = player.n
	if (n.prod || n.points.lt(1)) return
	n.prod = true; n.t = 0; n.genre = g; n.invest = n.points; n.points = nd(0); n.mama = 0
}
NW.mama = function () {
	const n = player.n
	if (!n.prod || n.mama) return
	n.mama = n.genre === 1 ? 1 : -1
	n.mamas++
}
NW.finishFilm = function () {
	const n = player.n
	let r = 5 + Math.floor(NW.rnd() * 5) - 2
	if (NW.u('n', 12)) r += 1
	if (n.genre === n.hot) r += 2
	if (n.genre === n.cold) r -= 2
	r += n.mama > 0 ? 2 : n.mama < 0 ? -1 : 0
	if (NW.u('n', 22) && n.genre === n.lastG) r += 1
	r += Math.floor(NW.vlv(15) / 2)
	r = Math.max(1, Math.min(10, r))
	let box = n.invest.times(r * r * 2).times(NW.mult('box'))
	if (n.genre === n.hot) box = box.times(NW.hotMult())
	if (n.genre === n.cold) box = box.times(0.3)
	if (r === 10 && NW.u('n', 21)) box = box.times(3)
	n.box = n.box.add(box)
	n.films++
	n.bestR = Math.max(n.bestR, r)
	const G = NW.GENRES[n.genre]
	const title = G.t[n.films % G.t.length] + (n.genre === n.lastG ? ' ' + (n.chain + 2) : '')
	n.chain = n.genre === n.lastG ? n.chain + 1 : 0
	n.lastG = n.genre
	n.log = [`${G.i}《${title}》 菊瓣 ${'🌼'.repeat(Math.ceil(r / 2))} ${r} 分，票房 ${format(box)}`].concat(n.log).slice(0, 5)
	n.prod = false
	n.invest = nd(0)
}
NW.nTick = function (diff) {
	const n = player.n
	NW.tasteTick(diff)
	let left = diff
	for (let i = 0; i < 20; i++) {
		if (!n.prod) {
			if (NW.u('n', 15) && n.auto && n.points.gte(1)) {
				NW.startFilm(NW.card(7) ? n.hot : n.genre)
				if (n.genre === 1) NW.mama()
			} else break
		}
		const need = NW.filmDur() - n.t
		if (left < need) { n.t += left; break }
		left -= need
		NW.finishFilm()
	}
}

NW.toggleCard = function (id) {
	const d = player.d
	if (d.eq.includes(id)) { d.eq = d.eq.filter(x => x !== id); return }
	if (NW.used() + NW.CARD[id].tok > NW.window()) return
	d.eq = d.eq.concat([id])
}

	const d = player.d
	while (d.eq.length && NW.used() > NW.window()) d.eq = d.eq.slice(0, -1)
}

NW.riceCap = function () { return player.k.points.max(1).times(NW.mult('rice')) }
NW.riceG = function () { return 0.04 * (NW.u('k', 11) ? 2 : 1) * (NW.card(8) ? 3 : 1) }
NW.riceSeed = function () { return NW.u('k', 12) ? 0.05 : 0.01 }
NW.kTick = function (diff) {
	const k = player.k
	if (k.points.lte(0) && k.frac <= 0) return
	if (k.frac <= 0) k.frac = NW.riceSeed()
	const g = NW.riceG()
	k.frac = 1 / (1 + (1 / k.frac - 1) * Math.exp(-g * diff))
	if (NW.u('k', 15) && k.auto && k.frac >= 0.9) { NW.eat(); NW.fertilize() }
}
NW.eat = function () {
	const k = player.k
	const rice = NW.riceCap().times(k.frac)
	if (rice.lt(1)) return
	k.fat = k.fat.add(rice.pow(0.5).times(NW.mult('fat')))
	k.poop = k.poop.add(rice.pow(0.3))
	k.frac = NW.riceSeed()
	k.eats++
}
NW.fertilize = function () { const k = player.k; k.fert = k.fert.add(k.poop); k.poop = nd(0) }
NW.poopBox = function () {
	const k = player.k
	if (k.poop.lt(1)) return
	NW.openBoxes(k.poop.times(10), 10, true)
	k.poop = nd(0)
	k.boxes++
}

NW.foundCount = function () { return Object.keys(player.x.found).filter(k => player.x.found[k] > 0).length }
NW.totalLv = function () { let t = 0; for (const k in player.x.found) t += player.x.found[k]; return t }
NW.genCost = function () { const f = NW.foundCount(); return nd(10).times(Decimal.pow(6, f)).times(Decimal.pow(2, NW.totalLv() - f)) }
NW.kwClick = function (i) {
	const x = player.x
	if (x.A === i && x.B < 0) { x.A = -1; return }
	if (x.B === i) { x.B = -1; return }
	if (x.A < 0) x.A = i
	else if (x.B < 0) x.B = i
	else { x.A = x.B; x.B = i }
}
NW.generate = function () {
	const x = player.x
	if (x.A < 0 || x.B < 0) return
	const c = NW.genCost()
	if (x.points.lt(c)) return
	const v = NW.recipe(x.A, x.B)
	x.gens++
	if (!v || (x.found[v.id] || 0) >= 5) {
		x.points = x.points.sub(c.div(2))
		if (!v) { x.fails++; x.msg = '图崩了：' + NW.FAILS[x.fails % NW.FAILS.length] + '（退回一半畸变点）' }
		else x.msg = `「${v.n}」已经 5 级了，再画也画不出新花样。（退回一半畸变点）`
		return
	}
	x.points = x.points.sub(c)
	const first = !x.found[v.id]
	x.found = Object.assign({}, x.found, { [v.id]: (x.found[v.id] || 0) + 1 })
	x.msg = first ? `新变体：「${v.n}」！${v.d}` : `「${v.n}」升到了 ${x.found[v.id]} 级。`
	if (first) doPopup('none', v.n, '发现新变体', 3, '#ff8fd8')
}
NW.hintText = function () {
	for (const v of NW.VARIANTS) if (!player.x.found[v.id]) return `豆包翻了翻笔记：有一个配方里含有「${NW.KW[v.a]}」……`
	return '豆包：所有配方都记下来了。'
}
NW.gallery = function () {
	let h = '<div class="gallery">'
	for (const v of NW.VARIANTS) {
		const lv = player.x.found[v.id] || 0
		h += lv ? `<div class="var on"><b>${v.n}</b><small>${NW.KW[v.a]} + ${NW.KW[v.b]}</small><span>Lv.${lv}　${v.d}</span></div>`
			: '<div class="var"><b>？？？</b><small>未发现</small></div>'
	}
	return h + '</div>'
}

	if (!rows.length) h += '<tr><td colspan="2">暂时没有任何加成。</td></tr>'
	for (const [l, v] of rows) h += `<tr><td>${l}</td><td>×${format(v)}</td></tr>`
	h += `<tr class="total"><td>合计</td><td>×${format(NW.mult(key))}</td></tr></table>`
	if (key === 'ha') {
		if (NW.inC('l', 11)) h += '<p>挑战“我才是奶龙”：以上结果开平方。</p>'
		if (NW.inC('l', 16)) h += '<p>挑战“变色失灵”：以上结果 ^0.75。</p>'

	return h + '</div>'
}

	<script>
var tmp = {}
var temp = tmp // Proxy for tmp
var funcs = {}
var NaNalert = false;

// Tmp will not call these
var activeFunctions = [
	"startData", "onPrestige", "doReset", "update", "automate",
	"buy", "buyMax", "respec", "onPress", "onClick", "onHold", "masterButtonPress",
	"sellOne", "sellAll", "pay", "actualCostFunction", "actualEffectFunction",
	"effectDescription", "display", "fullDisplay", "effectDisplay", "rewardDisplay",
	"tabFormat", "content",
	"onComplete", "onPurchase", "onEnter", "onExit", "done",
	"getUnlocked", "getStyle", "getCanClick", "getTitle", "getDisplay"
]

var noCall = doNotCallTheseFunctionsEveryTick
for (const item in noCall) {
	activeFunctions.push(noCall[item])
}

// Add the names of classes to traverse
var traversableClasses = []
// Each funcs subtree has its own plan, so purchases and visible tabs can refresh independently.
const tempPlans = new WeakMap()

function setupTemp() {
	tmp = {}
	tmp.pointGen = {}
	tmp.backgroundStyle = {}
	tmp.displayThings = []
	tmp.scrolled = 0
	tmp.gameEnded = false
	funcs = {}
	
	setupTempData(layers, tmp, funcs)
	for (const layer in layers){
		tmp[layer].resetGain = {}
		tmp[layer].nextAt = {}
		tmp[layer].nextAtDisp = {}
		tmp[layer].canReset = {}
		tmp[layer].notify = {}
		tmp[layer].prestigeNotify = {}
		tmp[layer].computedNodeStyle = []
		setupBuyables(layer)
		tmp[layer].trueGlowColor = []
	}

	tmp.other = {
		lastPoints: player.points || decimalZero,
		oomps: decimalZero,
		screenWidth: 0,
		screenHeight: 0,
    }

	updateWidth()

	temp = tmp
}

const boolNames = ["unlocked", "deactivated"]

function setupTempData(layerData, tmpData, funcsData) {
	for (const item in layerData){
		if (layerData[item] == null) {
			tmpData[item] = null
		}
		else if (layerData[item] instanceof Decimal)
			tmpData[item] = layerData[item]
		else if (Array.isArray(layerData[item])) {
			tmpData[item] = []
			funcsData[item] = []
			setupTempData(layerData[item], tmpData[item], funcsData[item])
		}
		else if ((!!layerData[item]) && (layerData[item].constructor === Object)) {
			tmpData[item] = {}
			funcsData[item] = {}
			setupTempData(layerData[item], tmpData[item], funcsData[item])
		}
		else if ((!!layerData[item]) && (typeof layerData[item] === "object") && traversableClasses.includes(layerData[item].constructor.name)) {
			tmpData[item] = new layerData[item].constructor()
			funcsData[item] = new layerData[item].constructor()
		}
		else if (isFunction(layerData[item]) && !activeFunctions.includes(item)){
			funcsData[item] = layerData[item]
			if (boolNames.includes(item))
				tmpData[item] = false
			else
				tmpData[item] = decimalOne // The safest thing to put probably?
		} else {
			tmpData[item] = layerData[item]
		}
	}	
}


function updateTemp() {
	if (tmp === undefined)
		setupTemp()

	updateTempData(layers, tmp, funcs)

	for (const layer in layers){
		tmp[layer].resetGain = getResetGain(layer)
		tmp[layer].nextAt = getNextAt(layer)
		// Only static buy-max and mod overrides distinguish the display threshold.
		tmp[layer].nextAtDisp = layers[layer].getNextAt !== undefined ||
			(tmp[layer].type === "static" && tmp[layer].canBuyMax) ? getNextAt(layer, true) : tmp[layer].nextAt
		tmp[layer].canReset = canReset(layer)
		tmp[layer].trueGlowColor = tmp[layer].glowColor
		tmp[layer].notify = shouldNotify(layer)
		tmp[layer].prestigeNotify = prestigeNotify(layer)
		if (tmp[layer].passiveGeneration === true) tmp[layer].passiveGeneration = 1 // new Decimal(true) = decimalZero

	}

	tmp.pointGen = getPointGen()
	tmp.backgroundStyle = readData(backgroundStyle)

	tmp.displayThings = []
	for (const thing in displayThings){
		let text = displayThings[thing]
		if (isFunction(text)) text = text()
		tmp.displayThings.push(text) 
	}
}

function getTempPlan(layerData, funcsData) {
	let plan = tempPlans.get(funcsData)
	if (plan) return plan
	plan = []
	for (const key in funcsData) {
		const value = layerData[key]
		if (typeof value === 'function') plan.push({key, children: null})
		else if (value && typeof value === 'object') {
			if (Array.isArray(value) && (key === 'tabFormat' || key === 'content')) continue
			const children = getTempPlan(value, funcsData[key])
			if (children.length) plan.push({key, children})
		}
	}
	tempPlans.set(funcsData, plan)
	return plan
}

function applyTempPlan(source, target, plan, useThis) {
	for (const {key, children} of plan) {
		const value = source[key]
		if (children) {
			if (value && target[key]) applyTempPlan(value, target[key], children, useThis)
		} else if (typeof value === 'function') {
			const previous = target[key]
			if (typeof previous === 'function') continue
			const next = value.call(useThis === undefined ? source : useThis)
			if (next !== previous || !(key in target)) Vue.set(target, key, next)
		}
	}
}

function updateTempData(layerData, tmpData, funcsData, useThis) {
	if (funcsData && layerData && tmpData) applyTempPlan(layerData, tmpData, getTempPlan(layerData, funcsData), useThis)
}

function updateChallengeTemp(layer)
{
	updateTempData(layers[layer].challenges, tmp[layer].challenges, funcs[layer].challenges)
}


function updateBuyableTemp(layer)

function updateClickableTemp(layer)

function buyableEffectAt(x) {

}

function setupBuyables(layer) {
	for (const id in layers[layer].buyables) {
		if (isPlainObject(layers[layer].buyables[id])) {
			let b = layers[layer].buyables[id]
			if (typeof b.cost === 'function' && b.cost !== buyableCostAt) {
				b.actualCostFunction = b.cost
				b.cost = buyableCostAt
			}
			if (typeof b.effect === 'function' && b.effect !== buyableEffectAt) {
				b.actualEffectFunction = b.effect
				b.effect = buyableEffectAt
			}
		}
	}
}

function checkDecimalNaN(x) {

}

	<script>
var player;
var needCanvasUpdate = true;

// Don't change this
const TMT_VERSION = {
	tmtNum: "2.7",
	tmtName: "Δ"
}

function getResetGain(layer, useType = null) {
	let type = useType
	if (!useType){ 
		type = tmp[layer].type
		if (layers[layer].getResetGain !== undefined)
			return layers[layer].getResetGain()
	} 
	if(tmp[layer].type == "none")
		return new Decimal (0)
	if (tmp[layer].gainExp.eq(0)) return decimalZero
	if (type=="static") {
		if ((!tmp[layer].canBuyMax) || tmp[layer].baseAmount.lt(tmp[layer].requires)) return decimalOne
		let gain = tmp[layer].baseAmount.div(tmp[layer].requires).div(tmp[layer].gainMult).max(1).log(tmp[layer].base).times(tmp[layer].gainExp).pow(Decimal.pow(tmp[layer].exponent, -1))
		gain = gain.times(tmp[layer].directMult)
		return gain.floor().sub(player[layer].points).add(1).max(1);
	} else if (type=="normal"){
		if (tmp[layer].baseAmount.lt(tmp[layer].requires)) return decimalZero
		let gain = tmp[layer].baseAmount.div(tmp[layer].requires).pow(tmp[layer].exponent).times(tmp[layer].gainMult).pow(tmp[layer].gainExp)
		if (gain.gte(tmp[layer].softcap)) gain = gain.pow(tmp[layer].softcapPower).times(tmp[layer].softcap.pow(decimalOne.sub(tmp[layer].softcapPower)))
		gain = gain.times(tmp[layer].directMult)
		return gain.floor().max(0);
	} else if (type=="custom"){
		return layers[layer].getResetGain()
	} else {
		return decimalZero
	}
}

function getNextAt(layer, canMax=false, useType = null) {
	let type = useType
	if (!useType) {
		type = tmp[layer].type
		if (layers[layer].getNextAt !== undefined)
			return layers[layer].getNextAt(canMax)

		}
	if(tmp[layer].type == "none")
		return new Decimal (Infinity)

	if (tmp[layer].gainMult.lte(0)) return new Decimal(Infinity)
	if (tmp[layer].gainExp.lte(0)) return new Decimal(Infinity)

	if (type=="static") 
	{
		if (!tmp[layer].canBuyMax) canMax = false
		let amt = player[layer].points.plus((canMax&&tmp[layer].baseAmount.gte(tmp[layer].nextAt))?tmp[layer].resetGain:0).div(tmp[layer].directMult)
		let extraCost = Decimal.pow(tmp[layer].base, amt.pow(tmp[layer].exponent).div(tmp[layer].gainExp)).times(tmp[layer].gainMult)
		let cost = extraCost.times(tmp[layer].requires).max(tmp[layer].requires)
		if (tmp[layer].roundUpCost) cost = cost.ceil()
		return cost;
	} else if (type=="normal"){
		let next = tmp[layer].resetGain.add(1).div(tmp[layer].directMult)
		if (next.gte(tmp[layer].softcap)) next = next.div(tmp[layer].softcap.pow(decimalOne.sub(tmp[layer].softcapPower))).pow(decimalOne.div(tmp[layer].softcapPower))
		next = next.root(tmp[layer].gainExp).div(tmp[layer].gainMult).root(tmp[layer].exponent).times(tmp[layer].requires).max(tmp[layer].requires)
		if (tmp[layer].roundUpCost) next = next.ceil()
		return next;
	} else if (type=="custom"){
		return layers[layer].getNextAt(canMax)
	} else {
		return decimalZero
	}}

function softcap(value, cap, power = 0.5) {
	if (value.lte(cap)) return value
	else
		return value.pow(power).times(cap.pow(decimalOne.sub(power)))
}

// Return true if the layer should be highlighted. By default checks for upgrades only.
function shouldNotify(layer){
	if (tmp[layer].upgrades && !tmp[layer].deactivated) {
		const slots = ownedIdSlots(player[layer].upgrades)
		for (const id in tmp[layer].upgrades) {
			const upg = tmp[layer].upgrades[id]
			if (upg && upg.unlocked && !ownsId(player[layer].upgrades, id, slots) && isPlainObject(layers[layer].upgrades[id]) && canAffordUpgrade(layer, id)) return true
		}
	}
	if (player[layer].activeChallenge && canCompleteChallenge(layer, player[layer].activeChallenge)) {
		return true
	}

	if (tmp[layer].shouldNotify)
		return true

	if (isPlainObject(tmp[layer].tabFormat)) {
		for (const subtab in tmp[layer].tabFormat){
			if (subtabShouldNotify(layer, 'mainTabs', subtab)) {
				tmp[layer].trueGlowColor = tmp[layer].tabFormat[subtab].glowColor || defaultGlow

				return true
			}
		}
	}

	for (const family in tmp[layer].microtabs) {
		for (const subtab in tmp[layer].microtabs[family]){
			if (subtabShouldNotify(layer, family, subtab)) {
				tmp[layer].trueGlowColor = tmp[layer].microtabs[family][subtab].glowColor
				return true
			}
		}
	}
	 
	return false
	
}

function canReset(layer)
{	
	if (layers[layer].canReset!== undefined)
		return run(layers[layer].canReset, layers[layer])
	else if(tmp[layer].type == "normal")
		return tmp[layer].baseAmount.gte(tmp[layer].requires)
	else if(tmp[layer].type== "static")
		return tmp[layer].baseAmount.gte(tmp[layer].nextAt) 
	else 
		return false
}

function rowReset(row, layer) {
	for (lr in ROW_LAYERS[row]){
		if(layers[lr].doReset) {
			if (!isNaN(row)) Vue.set(player[lr], "activeChallenge", null) // Exit challenges on any row reset on an equal or higher row
			run(layers[lr].doReset, layers[lr], layer)
		}
		else
			if(tmp[layer].row > tmp[lr].row && !isNaN(row)) layerDataReset(lr)
	}
}

function layerDataReset(layer, keep = []) {
	let storedData = {unlocked: player[layer].unlocked, forceTooltip: player[layer].forceTooltip, noRespecConfirm: player[layer].noRespecConfirm, prevTab:player[layer].prevTab} // Always keep these

	for (thing in keep) {
		if (player[layer][keep[thing]] !== undefined)
			storedData[keep[thing]] = player[layer][keep[thing]]
	}

	Vue.set(player[layer], "buyables", getStartBuyables(layer))
	Vue.set(player[layer], "clickables", getStartClickables(layer))
	Vue.set(player[layer], "challenges", getStartChallenges(layer))
	Vue.set(player[layer], "grid", getStartGrid(layer))

	layOver(player[layer], getStartLayerData(layer))
	player[layer].upgrades = []
	player[layer].milestones = []
	player[layer].achievements = []

	for (thing in storedData) {
		player[layer][thing] =storedData[thing]
	}
}



function addPoints(layer, gain) {
	player[layer].points = player[layer].points.add(gain).max(0)
	if (player[layer].best) player[layer].best = player[layer].best.max(player[layer].points)
	if (player[layer].total) player[layer].total = player[layer].total.add(gain)
}

function generatePoints(layer, diff) {
	addPoints(layer, tmp[layer].resetGain.times(diff))
}

function doReset(layer, force=false) {
	if (tmp[layer].type == "none") return
	let row = tmp[layer].row
	if (!force) {
		
		if (tmp[layer].canReset === false) return;
		
		if (tmp[layer].baseAmount.lt(tmp[layer].requires)) return;
		let gain = tmp[layer].resetGain
		if (tmp[layer].type=="static") {
			if (tmp[layer].baseAmount.lt(tmp[layer].nextAt)) return;
			gain =(tmp[layer].canBuyMax ? gain : 1)
		}

		if (layers[layer].onPrestige){
			updateMilestones(layer)
			run(layers[layer].onPrestige, layers[layer], gain)
		}
		
		addPoints(layer, gain)
		updateMilestones(layer)
		updateAchievements(layer)

		if (!player[layer].unlocked) {
			player[layer].unlocked = true;
			needCanvasUpdate = true;

			if (tmp[layer].increaseUnlockOrder){
				lrs = tmp[layer].increaseUnlockOrder
				for (lr in lrs)
					if (!player[lrs[lr]].unlocked) player[lrs[lr]].unlockOrder++
			}
		}
	
	}

	if (run(layers[layer].resetsNothing, layers[layer])) return
	tmp[layer].baseAmount = decimalZero // quick fix


	for (layerResetting in layers) {
		if (row >= layers[layerResetting].row && (!force || layerResetting != layer)) completeChallenge(layerResetting)
	}

	player.points = (row == 0 ? decimalZero : getStartPoints())

	for (let x = row; x >= 0; x--) rowReset(x, layer)
	for (r in OTHER_LAYERS){
		rowReset(r, layer)
	}

	player[layer].resetTime = 0

	updateTemp()
	updateTemp()
}

function resetRow(row) {
	if (prompt('确定要重置这一行吗？建议在本轮结束后再操作。请输入“确认重置”以继续。')!="确认重置") return
	let pre_layers = ROW_LAYERS[row-1]
	let layers = ROW_LAYERS[row]
	let post_layers = ROW_LAYERS[row+1]
	rowReset(row+1, post_layers[0])
	doReset(pre_layers[0], true)
	for (let layer in layers) {
		player[layer].unlocked = false
		if (player[layer].unlockOrder) player[layer].unlockOrder = 0
	}
	player.points = getStartPoints()
	updateTemp();
	resizeCanvas();
}

function startChallenge(layer, x) {
	let enter = false
	if (!player[layer].unlocked || !tmp[layer].challenges[x].unlocked || !canEnterChallenge(layer, x)) return

	if (player[layer].activeChallenge == x) {
		// This needs to be embedded due to how 'enter' works
		if(canExitChallenge(layer, x)){
			completeChallenge(layer, x)
			Vue.set(player[layer], "activeChallenge", null)
		}
	}
	else {
		enter = true
	}
	if(enter || canExitChallenge(layer, x)) doReset(layer, true)
	if(enter) {
		Vue.set(player[layer], "activeChallenge", x)
		run(layers[layer].challenges[x].onEnter, layers[layer].challenges[x])
	}
	updateChallengeTemp(layer)
}

function canCompleteChallenge(layer, x)
{
	if (x != player[layer].activeChallenge) return
	let challenge = tmp[layer].challenges[x]
	if (challenge.canComplete !== undefined) return challenge.canComplete

	if (challenge.currencyInternalName){
		let name = challenge.currencyInternalName
		if (challenge.currencyLocation){
			return !(challenge.currencyLocation[name].lt(challenge.goal)) 
		}
		else if (challenge.currencyLayer){
			let lr = challenge.currencyLayer
			return !(player[lr][name].lt(challenge.goal)) 
		}
		else {
			return !(player[name].lt(challenge.goal))
		}
	}
	else {
		return !(player.points.lt(challenge.goal))
	}

}

function completeChallenge(layer, x) {
	var x = player[layer].activeChallenge
	if (!x) return
	
	let completions = canCompleteChallenge(layer, x)
	if (!completions){
		Vue.set(player[layer], "activeChallenge", null)
		run(layers[layer].challenges[x].onExit, layers[layer].challenges[x])
		return
	}
	if (player[layer].challenges[x] < tmp[layer].challenges[x].completionLimit) {
		needCanvasUpdate = true
		player[layer].challenges[x] += completions
		player[layer].challenges[x] = Math.min(player[layer].challenges[x], tmp[layer].challenges[x].completionLimit)
		if (layers[layer].challenges[x].onComplete) run(layers[layer].challenges[x].onComplete, layers[layer].challenges[x])
	}
	Vue.set(player[layer], "activeChallenge", null)
	run(layers[layer].challenges[x].onExit, layers[layer].challenges[x])
	updateChallengeTemp(layer)
}

VERSION.withoutName = "v" + VERSION.num + (VERSION.pre ? " Pre-Release " + VERSION.pre : VERSION.pre ? " Beta " + VERSION.beta : "")
VERSION.withName = VERSION.withoutName + (VERSION.name ? ": " + VERSION.name : "")


function autobuyUpgrades(layer){
	if (!tmp[layer].upgrades) return
	for (const id in tmp[layer].upgrades)
		if (isPlainObject(tmp[layer].upgrades[id]) && (layers[layer].upgrades[id].canAfford === undefined || layers[layer].upgrades[id].canAfford() === true))
			buyUpg(layer, id) 
}

function updateGameLayer(layer, diff) {
	player[layer].resetTime += diff
	if (tmp[layer].passiveGeneration) generatePoints(layer, diff * tmp[layer].passiveGeneration)
	if (layers[layer].update) layers[layer].update(diff)
}

function automateGameLayer(layer, sideRow) {
	if (tmp[layer].autoPrestige && tmp[layer].canReset) doReset(layer)
	if (layers[layer].automate) layers[layer].automate()
	if (sideRow) player[layer].best = player[layer].best.max(player[layer].points)
	if (tmp[layer].autoUpgrade) autobuyUpgrades(layer)
}

function gameLoop(diff) {
	if (isEndgame() || tmp.gameEnded){
		tmp.gameEnded = true
		clearParticles()
	}

	if (isNaN(diff) || diff < 0) diff = 0
	if (tmp.gameEnded && !player.keepGoing) {
		diff = 0
		//player.tab = "tmp.gameEnded"
		clearParticles()
	}

	if (maxTickLength) {
		let limit = maxTickLength()
		if(diff > limit)
			diff = limit
	}
	addTime(diff)
	player.points = player.points.add(tmp.pointGen.times(diff)).max(0)

	// TREE_LAYERS is already compacted and sorted by updateLayers(), even for sparse rows.
	for (const row of TREE_LAYERS)
		for (const layer of row) updateGameLayer(layer, diff)
	for (const row in OTHER_LAYERS)
		for (const layer of OTHER_LAYERS[row]) updateGameLayer(layer, diff)
	for (let i = TREE_LAYERS.length - 1; i >= 0; i--)
		for (const layer of TREE_LAYERS[i]) automateGameLayer(layer, false)
	for (const row in OTHER_LAYERS)
		for (const layer of OTHER_LAYERS[row]) automateGameLayer(layer, true)

	for (const layer in layers){

	let diff = Math.max(0, (now - player.time) / 1e3) || 0
	let trueDiff = diff
	if (player.offTime !== undefined) {
		if (player.offTime.remain > modInfo.offlineLimit * 3600) player.offTime.remain = modInfo.offlineLimit * 3600

	let cost = tmp[layer].upgrades[id].cost

	return (b.unlocked && run(b.canAfford, b) && player[layer].buyables[id].lt(b.purchaseLimit) && !tmp[layer].deactivated)

function canAffordPurchase(layer, thing, cost) {
	if (thing.currencyInternalName) {
		let name = thing.currencyInternalName
		if (thing.currencyLocation) {
			return !(thing.currencyLocation[name].lt(cost))
		}
		else if (thing.currencyLayer) {
			let lr = thing.currencyLayer
			return !(player[lr][name].lt(cost))
		}
		else {
			return !(player[name].lt(cost))
		}
	}
	else {
		return !(player[layer].points.lt(cost))
	}
}

function buyUpgrade(layer, id) {
	buyUpg(layer, id)
}

function buyUpg(layer, id) {
	if (!tmp[layer].upgrades || !tmp[layer].upgrades[id]) return
	let upg = tmp[layer].upgrades[id]
	if (!player[layer].unlocked || player[layer].deactivated || tmp[layer].deactivated) return
	if (!tmp[layer].upgrades[id].unlocked) return
	if (ownsId(player[layer].upgrades, id)) return
	if (upg.canAfford === false) return
	let pay = layers[layer].upgrades[id].pay
	if (pay !== undefined)
		run(pay, layers[layer].upgrades[id])
	else {
		let cost = tmp[layer].upgrades[id].cost

		if (upg.currencyInternalName) {
			let name = upg.currencyInternalName
			if (upg.currencyLocation) {
				if (upg.currencyLocation[name].lt(cost)) return
				upg.currencyLocation[name] = upg.currencyLocation[name].sub(cost)
			}
			else if (upg.currencyLayer) {
				let lr = upg.currencyLayer
				if (player[lr][name].lt(cost)) return
				player[lr][name] = player[lr][name].sub(cost)
			}
			else {
				if (player[name].lt(cost)) return
				player[name] = player[name].sub(cost)
			}
		}
		else {
			if (player[layer].points.lt(cost)) return
			player[layer].points = player[layer].points.sub(cost)
		}

	activePopups.push({ "time": popupTimer, "type": popupType, "title": popupTitle, "message": (popupMessage + "\n"), "id": popupID, "color": color })

//Function to reduce time on active popups
function adjustPopupTime(diff) {
	for (popup in activePopups) {
		activePopups[popup].time -= diff;
		if (activePopups[popup]["time"] < 0) {
			activePopups.splice(popup, 1); // Remove popup when time hits 0
		}
	}
}

function run(func, target, args = null) {
	if (isFunction(func)) {

		let bound = layers[layer].grid[func].bind(layers[layer].grid)
		return bound(data, id)
	}
	else
		return layers[layer].grid[func];
}

// Batch scans use slot hints, not a cached ownership answer: mod callbacks may
// replace, reorder or edit a save array between two IDs in the same pass.
function ownedIdSlots(ids) {
	if (ids.length < 64) return null
	const slots = new Map()
	for (let i = 0; i < ids.length; i++) slots.set(ids[i], i)
	return slots
}

function ownsId(ids, id, slots) {
	if (!ids.length) return false
	const numeric = toNumber(id), text = id.toString()
	if (slots) {
		const n = slots.get(numeric), s = slots.get(text)
		if ((n !== undefined && ids[n] === numeric) || (s !== undefined && ids[s] === text)) return true
	}
	return ids.includes(numeric) || ids.includes(text)
}

function hasUpgrade(layer, id) {
	return !tmp[layer].deactivated && ownsId(player[layer].upgrades, id)
}

function hasMilestone(layer, id) {
	return !tmp[layer].deactivated && ownsId(player[layer].milestones, id)
}

function hasAchievement(layer, id) {
	return !tmp[layer].deactivated && ownsId(player[layer].achievements, id)
}

function hasChallenge(layer, id) {
	return ((player[layer].challenges[id]) && !tmp[layer].deactivated)
}

function maxedChallenge(layer, id) {
	return ((player[layer].challenges[id] >= tmp[layer].challenges[id].completionLimit) && !tmp[layer].deactivated)
}

function canExitChallenge(layer, id){

function setBuyableAmount(layer, id, amt) {

function addBuyables(layer, id, amt) {

function getClickableState(layer, id) {

function getGridData(layer, id) {

function upgradeEffect(layer, id) {

			<clickables v-bind:style="tmp[layer].componentStyles['clickables']" :layer="layer"></clickables>
			<buyables v-bind:style="tmp[layer].componentStyles.buyables" :layer="layer"></buyables>
			<upgrades v-bind:style="tmp[layer].componentStyles['upgrades']" :layer="layer"></upgrades>
			<challenges v-bind:style="tmp[layer].componentStyles['challenges']" :layer="layer"></challenges>
			<achievements v-bind:style="tmp[layer].componentStyles.achievements" :layer="layer"></achievements>
			<br><br>
		</div>
		<div v-if="tmp[layer].tabFormat">
			<div v-if="Array.isArray(tmp[layer].tabFormat)"><div v-if="spacing" v-bind:style="{'height': spacing}"></div>
				<column :layer="layer" :data="tmp[layer].tabFormat" :key="this.$vnode.key + '-col'"></column>
			</div>
			<div v-else>
				<div class="upgTable" v-bind:style="{'padding-top': (embedded ? '0' : '25px'), 'margin-top': (embedded ? '-10px' : '0'), 'margin-bottom': '24px'}">
					<tab-buttons v-bind:style="tmp[layer].componentStyles['tab-buttons']" :layer="layer" :data="tmp[layer].tabFormat" :name="'mainTabs'"></tab-buttons>
				</div>
				<layer-tab v-if="tmp[layer].tabFormat[player.subtabs[layer].mainTabs].embedLayer" :layer="tmp[layer].tabFormat[player.subtabs[layer].mainTabs].embedLayer" :embedded="true" :key="this.$vnode.key + '-' + layer"></layer-tab>
				<column v-else :layer="layer" :data="tmp[layer].tabFormat[player.subtabs[layer].mainTabs].content" :key="this.$vnode.key + '-col'"></column>
			</div>
		</div></div>
			`
	},

	'overlay-head': {
		template: `
		<div class="overlayThing headBlock" style="padding-bottom:7px; width: 90%; z-index: 1000; position: relative">
		<span v-if="player.devSpeed && player.devSpeed != 1" class="overlayThing headNote">开发倍率： {{format(player.devSpeed)}}x</span>
		<span v-if="player.offTime !== undefined" class="overlayThing headNote">剩余离线时间： {{formatTime(player.offTime.remain)}}</span>
		<span class="overlayThing headTitle">{{modInfo.name}}</span>
		<span v-if="player.points.lt('1e1000')" class="overlayThing headLabel">当前拥有 </span>
		<h2 class="overlayThing" id="points">{{format(player.points)}}</h2>
		<span v-if="player.points.lt('1e1e6')" class="overlayThing headUnit"> {{modInfo.pointsName}}</span>
		<span v-if="canGenPoints()" class="overlayThing headRate">{{tmp.other.oompsMag != 0 ? format(tmp.other.oomps) + " OOM" + (tmp.other.oompsMag < 0 ? "^OOM" : tmp.other.oompsMag > 1 ? "^" + tmp.other.oompsMag : "") + "s" : formatSmall(getPointGen())}}/秒</span>
		<div v-for="thing in tmp.displayThings" class="overlayThing headThing"><span v-if="thing" v-html="thing"></span></div>
	</div>
	`
    },

    'info-tab': {
        template: `
        <div class="infoPanel">
        <h2 class="infoTitle">{{modInfo.name}}</h2>
        <span class="infoVersion">{{VERSION.withName}}</span>
        <span v-if="modInfo.author" class="infoAuthor">作者：{{modInfo.author}}</span>
        <div class="infoStat"><span class="infoStatLabel">游戏时长</span><span class="infoStatValue">{{ formatTime(player.timePlayed) }}</span></div>
        <div class="infoLinks">
            <div class="link" onclick="showTab('changelog-tab')">更新日志</div>
            <a v-if="modInfo.discordLink" class="link" v-bind:href="modInfo.discordLink" target="_blank">{{modInfo.discordName}}</a>
        </div>
        <div class="infoSection">
            <h3>快捷键</h3>
            <div class="hotkeyList"><span v-for="key in hotkeys" v-if="player[key.layer].unlocked && tmp[key.layer].hotkeys[key.id].unlocked" class="hotkey">{{key.description}}</span></div>
        </div>
        <div class="infoCredits">奶蛙、奶龙、奶鸡等形象来自网络梗文化，本作为同人小游戏，与任何品牌无关。<br>模组树引擎 <a v-bind:href="'https://github.com/Acamaeda/The-Modding-Tree/blob/master/changelog.md'" target="_blank" class="link inlineLink">{{TMT_VERSION.tmtNum}}</a>：Acamaeda、FlamemasterNXF<br>原作《声望树》：Jacorb、Aarex</div>
        </div>
    `
    },

    'options-tab': {
        template: `
        <div class="optionsPanel">
            <div class="optGroup">
                <h3 class="optGroupTitle">存档</h3>
                <div class="optActions">
                    <button class="opt optAction" onclick="save()">保存</button>
                    <button class="opt optAction" onclick="exportSave()">导出到剪贴板</button>
                    <button class="opt optAction" onclick="importSave()">导入存档</button>
                </div>
                <button class="opt optToggle" onclick="toggleOpt('autosave')"><span class="optLabel">自动保存</span><span class="optValue" v-bind:class="{on: options.autosave}">{{ options.autosave?"开":"关" }}</span></button>
                <button class="opt optToggle" onclick="toggleOpt('offlineProd')"><span class="optLabel">离线收益</span><span class="optValue" v-bind:class="{on: options.offlineProd}">{{ options.offlineProd?"开":"关" }}</span></button>
            </div>
            <div class="optGroup">
                <h3 class="optGroupTitle">显示</h3>
                <button class="opt optToggle" onclick="switchTheme()"><span class="optLabel">主题</span><span class="optValue">{{ getThemeLabel() }}</span></button>
                <button class="opt optToggle" onclick="adjustMSDisp()"><span class="optLabel">里程碑筛选</span><span class="optValue">{{ MS_DISPLAYS[MS_SETTINGS.indexOf(options.msDisplay)]}}</span></button>
                <button class="opt optToggle" onclick="toggleOpt('hideChallenges')"><span class="optLabel">已完成的挑战</span><span class="optValue" v-bind:class="{on: !options.hideChallenges}">{{ options.hideChallenges?"隐藏":"显示" }}</span></button>
                <button class="opt optToggle" onclick="toggleOpt('hideMilestonePopups')"><span class="optLabel">里程碑弹窗</span><span class="optValue" v-bind:class="{on: !options.hideMilestonePopups}">{{ formatOption(!options.hideMilestonePopups) }}</span></button>
                <button class="opt optToggle" onclick="toggleOpt('hqTree')"><span class="optLabel">高画质树状图</span><span class="optValue" v-bind:class="{on: options.hqTree}">{{ options.hqTree?"开":"关" }}</span></button>
                <button class="opt optToggle" onclick="toggleOpt('forceOneTab'); needsCanvasUpdate = true"><span class="optLabel">单栏模式</span><span class="optValue" v-bind:class="{on: options.forceOneTab}">{{ options.forceOneTab?"始终":"自动" }}</span></button>
                <button class="opt optToggle" onclick="toggleOpt('forceTooltips'); needsCanvasUpdate = true"><span class="optLabel">Shift + 单击固定提示</span><span class="optValue" v-bind:class="{on: options.forceTooltips}">{{ options.forceTooltips?"开":"关" }}</span></button>
            </div>
            <div class="optGroup optDanger">
                <button class="opt optToggle" onclick="hardReset()"><span class="optLabel">清除进度</span><span class="optValue">删除存档</span></button>
            </div>
        </div>`
    },

    'back-button': {
        template: `
        <button v-bind:class="back" onclick="goBack()">←</button>
        `
    },


	'tooltip' : {
		props: ['text'],
		template: `<div class="tooltip" v-html="text"></div>
		`
	},

	'node-mark': {
		props: {'layer': {}, data: {}, offset: {default: 0}, scale: {default: 1}},
		template: `<div v-if='data'>
			<div v-if='data === true' class='star' v-bind:style='{position: "absolute", left: (offset-10) + "px", top: (offset-10) + "px", transform: "scale( " + scale||1 + ", " + scale||1 + ")"}'></div>
			<img v-else class='mark' v-bind:style='{position: "absolute", left: (offset-22) + "px", top: (offset-15) + "px", transform: "scale( " + scale||1 + ", " + scale||1 + ")"}' v-bind:src="data"></div>
		</div>
		`
	},

	'particle': {
		props: ['data', 'index'],
		template: `<div><div class='particle instant' v-bind:style="[constructParticleStyle(data), data.style]" 
			v-on:click="run(data.onClick, data)"  v-on:mouseenter="run(data.onMouseEnter, data)" v-on:mouseleave="run(data.onMouseLeave, data)" ><span v-html="data.text"></span>
		</div>
		<svg version="2" v-if="data.color">
		<mask v-bind:id="'pmask' + data.id">
        <image id="img" v-bind:href="data.image" x="0" y="0" :height="data.width" :width="data.height" />
    	</mask>
    	</svg>
		</div>
		`
	},

	'bg': {
		props: ['layer'],
		template: `<div class ="bg" v-bind:style="[tmp[layer].style ? tmp[layer].style : {}, (tmp[layer].tabFormat && !Array.isArray(tmp[layer].tabFormat)) ? tmp[layer].tabFormat[player.subtabs[layer].mainTabs].style : {}]"></div>
		`
	}

}


</script>
	<script>
var app;

function loadVue() {
	// data = a function returning the content (actually HTML)
	Vue.component('display-text', {
		props: ['layer', 'data'],
		template: `
			<span class="instant" v-html="data"></span>
		`
	})

// data = a function returning the content (actually HTML)
	Vue.component('raw-html', {
			props: ['layer', 'data'],
			template: `
				<span class="instant"  v-html="data"></span>
			`
		})

	// Blank space, data = optional height in px or pair with width and height in px
	Vue.component('blank', {
		props: ['layer', 'data'],
		template: `
			<div class = "instant">
			<div class = "instant" v-if="!data" v-bind:style="{'width': '8px', 'height': '17px'}"></div>
			<div class = "instant" v-else-if="Array.isArray(data)" v-bind:style="{'width': data[0], 'height': data[1]}"></div>
			<div class = "instant" v-else v-bind:style="{'width': '8px', 'height': data}"><br></div>
			</div>
		`
	})

	// Displays an image, data is the URL
	Vue.component('display-image', {
		props: ['layer', 'data'],
		template: `
			<img class="instant" v-bind:src= "data" v-bind:alt= "data">
		`
	})
		
	// data = an array of Components to be displayed in a row
	Vue.component('row', {
		props: ['layer', 'data'],
		computed: {
			key() {return this.$vnode.key}
		},
		template: `
		<div class="upgTable instant">
			<div class="upgRow">
				<div v-for="(item, index) in data">
				<div v-if="!Array.isArray(item)" v-bind:is="item" :layer= "layer" v-bind:style="tmp[layer].componentStyles[item]" :key="key + '-' + index"></div>
				<div v-else-if="item.length==3" v-bind:style="[tmp[layer].componentStyles[item[0]], (item[2] ? item[2] : {})]" v-bind:is="item[0]" :layer= "layer" :data= "item[1]" :key="key + '-' + index"></div>
				<div v-else-if="item.length==2" v-bind:is="item[0]" :layer= "layer" :data= "item[1]" v-bind:style="tmp[layer].componentStyles[item[0]]" :key="key + '-' + index"></div>
				</div>
			</div>
		</div>
		`
	})

	// data = an array of Components to be displayed in a column
	Vue.component('column', {
		props: ['layer', 'data'],
		computed: {
			key() {return this.$vnode.key}
		},
		template: `
		<div class="upgTable instant">
			<div class="upgCol">
				<div v-for="(item, index) in data">
					<div v-if="!Array.isArray(item)" v-bind:is="item" :layer= "layer" v-bind:style="tmp[layer].componentStyles[item]" :key="key + '-' + index"></div>
					<div v-else-if="item.length==3" v-bind:style="[tmp[layer].componentStyles[item[0]], (item[2] ? item[2] : {})]" v-bind:is="item[0]" :layer= "layer" :data= "item[1]" :key="key + '-' + index"></div>
					<div v-else-if="item.length==2" v-bind:is="item[0]" :layer= "layer" :data= "item[1]" v-bind:style="tmp[layer].componentStyles[item[0]]" :key="key + '-' + index"></div>
				</div>
			</div>
		</div>
		`
	})

	// data [other layer, tabformat for within proxy]
	Vue.component('layer-proxy', {
		props: ['layer', 'data'],
		computed: {
			key() {return this.$vnode.key}
		},
		template: `
		<div>
			<column :layer="data[0]" :data="data[1]" :key="key + 'col'"></column>
		</div>
		`
	})
	Vue.component('infobox', {
		props: ['layer', 'data'],
		template: `
		<div class="story instant" v-if="tmp[layer].infoboxes && tmp[layer].infoboxes[data]!== undefined && tmp[layer].infoboxes[data].unlocked" v-bind:style="[{'border-color': tmp[layer].color, 'border-radius': player.infoboxes[layer][data] ? 0 : '8px'}, tmp[layer].infoboxes[data].style]">
			<button class="story-title" v-bind:style="[{'background-color': tmp[layer].color}, tmp[layer].infoboxes[data].titleStyle]"
				v-on:click="player.infoboxes[layer][data] = !player.infoboxes[layer][data]">
				<span class="story-toggle">{{player.infoboxes[layer][data] ? "+" : "-"}}</span>
				<span v-html="tmp[layer].infoboxes[data].title ? tmp[layer].infoboxes[data].title : (tmp[layer].name)"></span>
			</button>
			<div v-if="!player.infoboxes[layer][data]" class="story-text" v-bind:style="tmp[layer].infoboxes[data].bodyStyle">
				<span v-html="tmp[layer].infoboxes[data].body ? tmp[layer].infoboxes[data].body : 'Blah'"></span>
			</div>
		</div>
		`
	})


	// Data = width in px, by default fills the full area
	Vue.component('h-line', {
		props: ['layer', 'data'],
			template:`
				<hr class="instant" v-bind:style="data ? {'width': data} : {}" class="hl">
			`
		})

	// Data = height in px, by default is bad
	Vue.component('v-line', {
		props: ['layer', 'data'],
		template: `
			<div class="instant" v-bind:style="data ? {'height': data} : {}" class="vl2"></div>
		`
	})

	Vue.component('challenges', {
		props: ['layer', 'data'],
		template: `
		<div v-if="tmp[layer].challenges" class="upgTable">
		<div v-for="row in (data === undefined ? tmp[layer].challenges.rows : data)" class="upgRow">
		<div v-for="col in tmp[layer].challenges.cols">
					<challenge v-if="tmp[layer].challenges[row*10+col]!== undefined && tmp[layer].challenges[row*10+col].unlocked" :layer = "layer" :data = "row*10+col" v-bind:style="tmp[layer].componentStyles.challenge"></challenge>
				</div>
			</div>
		</div>
		`
	})

	// data = id
	Vue.component('challenge', {
		props: ['layer', 'data'],
		template: `
		<div v-if="tmp[layer].challenges && tmp[layer].challenges[data]!== undefined && tmp[layer].challenges[data].unlocked && !(options.hideChallenges && maxedChallenge(layer, [data]) && !inChallenge(layer, [data]))"
			v-bind:class="['challenge', challengeStyle(layer, data), player[layer].activeChallenge === data ? 'resetNotify' : '']" v-bind:style="[{'--layer-color': tmp[layer].color}, tmp[layer].challenges[data].style]">
			<h3 class="chTitle" v-html="tmp[layer].challenges[data].name"></h3>
			<span v-if="layers[layer].challenges[data].fullDisplay" class="chBody" v-html="run(layers[layer].challenges[data].fullDisplay, layers[layer].challenges[data])"></span>
			<span v-else class="chBody">
				<span class="chDesc" v-html="tmp[layer].challenges[data].challengeDescription"></span>
				<span class="chLine"><span class="chKey">目标</span><span v-if="tmp[layer].challenges[data].goalDescription" v-html="tmp[layer].challenges[data].goalDescription"></span><span v-else>{{format(tmp[layer].challenges[data].goal)}} {{tmp[layer].challenges[data].currencyDisplayName ? tmp[layer].challenges[data].currencyDisplayName : modInfo.pointsName}}</span></span>
				<span class="chLine"><span class="chKey">奖励</span><span v-html="tmp[layer].challenges[data].rewardDescription"></span></span>
				<span v-if="layers[layer].challenges[data].rewardDisplay!==undefined" class="chLine"><span class="chKey">当前效果</span><span v-html="(tmp[layer].challenges[data].rewardDisplay) ? (run(layers[layer].challenges[data].rewardDisplay, layers[layer].challenges[data])) : format(tmp[layer].challenges[data].rewardEffect)"></span></span>
			</span>
			<button v-bind:class="{ longUpg: true, can: true, [layer]: true }" v-bind:style="{'background-color': tmp[layer].color}" v-on:click="startChallenge(layer, data)">{{challengeButtonText(layer, data)}}</button>
			<node-mark :layer='layer' :data='tmp[layer].challenges[data].marked' :offset="20" :scale="1.5"></node-mark>
		</div>
		`
	})

	Vue.component('upgrades', {
		props: ['layer', 'data'],
		template: `
		<div v-if="tmp[layer].upgrades" class="upgTable">
			<div v-for="row in (data === undefined ? tmp[layer].upgrades.rows : data)" class="upgRow">
				<div v-for="col in tmp[layer].upgrades.cols"><div v-if="tmp[layer].upgrades[row*10+col]!== undefined && tmp[layer].upgrades[row*10+col].unlocked" class="upgAlign">
					<upgrade :layer = "layer" :data = "row*10+col" v-bind:style="tmp[layer].componentStyles.upgrade"></upgrade>
				</div></div>
			</div>
			<br>
		</div>
		`
	})

	// data = id
	Vue.component('upgrade', {
		props: ['layer', 'data'],
		template: `
		<button v-if="tmp[layer].upgrades && tmp[layer].upgrades[data]!== undefined && tmp[layer].upgrades[data].unlocked" :id='"upgrade-" + layer + "-" + data' v-on:click="buyUpg(layer, data)" v-bind:class="{ [layer]: true, tooltipBox: true, upg: true, bought: hasUpgrade(layer, data), locked: (!(canAffordUpgrade(layer, data))&&!hasUpgrade(layer, data)), can: (canAffordUpgrade(layer, data)&&!hasUpgrade(layer, data))}"
			v-bind:style="[{'--layer-color': tmp[layer].color}, ((!hasUpgrade(layer, data) && canAffordUpgrade(layer, data)) ? {'background-color': tmp[layer].color} : {}), tmp[layer].upgrades[data].style]">
			<span v-if="layers[layer].upgrades[data].fullDisplay" v-html="run(layers[layer].upgrades[data].fullDisplay, layers[layer].upgrades[data])"></span>
			<span v-else class="upgContent">
				<span v-if= "tmp[layer].upgrades[data].title" class="upgTitle"><h3 v-html="tmp[layer].upgrades[data].title"></h3></span>
				<span class="upgDesc" v-html="tmp[layer].upgrades[data].description"></span>
				<span v-if="layers[layer].upgrades[data].effectDisplay" class="upgEffect">当前效果：<span v-html="run(layers[layer].upgrades[data].effectDisplay, layers[layer].upgrades[data])"></span></span>
				<span class="upgCost">花费：{{ formatWhole(tmp[layer].upgrades[data].cost) }} {{(tmp[layer].upgrades[data].currencyDisplayName ? tmp[layer].upgrades[data].currencyDisplayName : tmp[layer].resource)}}</span>
			</span>
			<tooltip v-if="tmp[layer].upgrades[data].tooltip" :text="tmp[layer].upgrades[data].tooltip"></tooltip>

			</button>
		`
	})

	Vue.component('milestones', {
		props: ['layer', 'data'],
		template: `
		<div v-if="tmp[layer].milestones">
			<table>
				<tr v-for="id in (data === undefined ? Object.keys(tmp[layer].milestones) : data)" v-if="tmp[layer].milestones[id]!== undefined && tmp[layer].milestones[id].unlocked && milestoneShown(layer, id)">
					<milestone :layer = "layer" :data = "id" v-bind:style="tmp[layer].componentStyles.milestone"></milestone>
				</tr>
			</table>
			<br>
		</div>
		`
	})

	// data = id
	Vue.component('milestone', {
		props: ['layer', 'data'],
		template: `
		<td v-if="tmp[layer].milestones && tmp[layer].milestones[data]!== undefined && milestoneShown(layer, data) && tmp[layer].milestones[data].unlocked" v-bind:style="[{'--layer-color': tmp[layer].color}, tmp[layer].milestones[data].style]" v-bind:class="{milestone: !hasMilestone(layer, data), tooltipBox: true, milestoneDone: hasMilestone(layer, data)}">
			<h3 class="msReq" v-html="tmp[layer].milestones[data].requirementDescription"></h3>
			<span class="msEffect" v-html="run(layers[layer].milestones[data].effectDescription, layers[layer].milestones[data])"></span>
			<tooltip v-if="tmp[layer].milestones[data].tooltip" :text="tmp[layer].milestones[data].tooltip"></tooltip>

		<span v-if="(tmp[layer].milestones[data].toggles)&&(hasMilestone(layer, data))" v-for="toggle in tmp[layer].milestones[data].toggles" class="msToggle"><toggle :layer= "layer" :data= "toggle" v-bind:style="tmp[layer].componentStyles.toggle"></toggle>&nbsp;</span></td></tr>
		`
	})

	Vue.component('toggle', {
		props: ['layer', 'data'],
		template: `
		<button class="smallUpg can" v-bind:style="{'background-color': tmp[data[0]].color}" v-on:click="toggleAuto(data)">{{player[data[0]][data[1]]?"开":"关"}}</button>
		`
	})

	Vue.component('prestige-button', {
		props: ['layer', 'data'],
		template: `
		<button v-if="(tmp[layer].type !== 'none')" v-bind:class="{ [layer]: true, reset: true, locked: !tmp[layer].canReset, can: tmp[layer].canReset}"
			v-bind:style="[{'--layer-color': tmp[layer].color}, tmp[layer].canReset ? {'background-color': tmp[layer].color} : {}, tmp[layer].componentStyles['prestige-button']]"
			v-html="prestigeButtonText(layer)" v-on:click="doReset(layer)">
		</button>
		`
	
	})

	// Displays the main resource for the layer
	Vue.component('main-display', {
		props: ['layer', 'data'],
		template: `
		<div class="mainDisplay"><span v-if="player[layer].points.lt('1e1000')" class="mdLabel">当前拥有 </span><h2 v-bind:style="{'color': tmp[layer].color, 'text-shadow': '0px 0px 10px ' + tmp[layer].color}">{{data ? format(player[layer].points, data) : formatWhole(player[layer].points)}}</h2> <span class="mdResource">{{tmp[layer].resource}}<span v-if="layers[layer].effectDescription">，<span v-html="run(layers[layer].effectDescription, layers[layer])"></span></span></span></div>
		`
	})

	// Displays the base resource for the layer, as well as the best and total values for the layer's currency, if tracked
	Vue.component('resource-display', {
		props: ['layer'],
		template: `
		<div style="margin-top: -13px">
			<span v-if="tmp[layer].baseAmount"><br>当前拥有 {{formatWhole(tmp[layer].baseAmount)}} {{tmp[layer].baseResource}}</span>
			<span v-if="tmp[layer].passiveGeneration"><br>每秒获得 {{format(tmp[layer].resetGain.times(tmp[layer].passiveGeneration))}} {{tmp[layer].resource}}</span>

	<script>
var canvas;
var ctx;

window.addEventListener("resize", (_=>resizeCanvas()));

function retrieveCanvasData() {
	let treeCanv = document.getElementById("treeCanvas")
	let treeTab = document.getElementById("treeTab")
	if (treeCanv===undefined||treeCanv===null) return false;
	canvas = treeCanv;
	ctx = canvas.getContext("2d");
	return true;
}

function resizeCanvas() {
	if (!retrieveCanvasData()) return
	// Render at the screen's real pixel density so branches stay sharp on high-DPI displays
	let dpr = window.devicePixelRatio || 1
	canvas.width = 0;
    canvas.height = 0;
	canvas.width  = Math.round(window.innerWidth * dpr);
	canvas.height = Math.round(window.innerHeight * dpr);
	canvas.style.width = window.innerWidth + "px";
	canvas.style.height = window.innerHeight + "px";
	ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
		drawTree();
}


var colors_theme

function drawTree() {
	if (!retrieveCanvasData()) return;
	ctx.clearRect(0, 0, canvas.width, canvas.height);
	for (layer in layers){
		if (tmp[layer].layerShown == true && tmp[layer].branches){
			for (branch in tmp[layer].branches)
				{
					drawTreeBranch(layer, tmp[layer].branches[branch])
				}
		}
		drawComponentBranches(layer, tmp[layer].upgrades, "upgrade-")
		drawComponentBranches(layer, tmp[layer].buyables, "buyable-")
		drawComponentBranches(layer, tmp[layer].clickables, "clickable-")

	}
}

function drawComponentBranches(layer, data, prefix) {
	for(id in data) {
		if (data[id].branches) {
			for (branch in data[id].branches)
			{
				drawTreeBranch(id, data[id].branches[branch], prefix + layer + "-")
			}

		}
	}

}

function drawTreeBranch(num1, data, prefix) { // taken from Antimatter Dimensions & adjusted slightly
	let num2 = data
	let color_id = 1
	let width = 15
	if (Array.isArray(data)){
		num2 = data[0]
		color_id = data[1]
		width = data[2] || width
	}

	if(typeof(color_id) == "number")
		color_id = colors_theme[color_id]
	if (prefix) {
		num1 = prefix + num1
		num2 = prefix + num2
	}

    ctx.shadowBlur = 0;
    ctx.globalAlpha = 0.95;
    ctx.lineWidth = Math.max(1.5, width * 0.2);

    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = Math.max(0.75, width * 0.07);
    ctx.stroke();
    ctx.restore();
}
